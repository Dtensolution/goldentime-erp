<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>골든타임 ERP</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1858a8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골든타임">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 바 + 좌측 메뉴(좁은 화면에서는 가로 탭) + 본문 */
/* 골든타임 브랜드: 로고의 블루(#1858a8)와 '365' 하늘색(#3fb4e0), 차콜 글자 */
:root{
  --bg:#eef4f8; --surface:#ffffff; --sunk:#e6eef4; --line:#d3dee7;
  --ink:#2b3137; --muted:#5f6b76; --accent:#2a9fd0; --accent-soft:#dff2fa;
  --navy:#1858a8; --navy-soft:#e1ebf7;
  --good:#2f7d4f; --warn:#b45309; --bad:#c0392b;
  --bar:#1858a8; --bar-weekend:#8fc6e6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e151d; --surface:#151f2a; --sunk:#1b2733; --line:#283746;
  --ink:#e7edf3; --muted:#9db0c2; --accent:#5cc6ee; --accent-soft:#163647;
  --navy:#7fb0ee; --navy-soft:#1c3150;
  --good:#5cc08a; --warn:#f0a44b; --bad:#f07a6e;
  --bar:#6fa4e8; --bar-weekend:#2f6d90; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:linear-gradient(180deg,var(--accent-soft) 0%,var(--bg) 55%)}
.login{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:28px 28px 22px;box-shadow:0 10px 30px -18px rgb(24 88 168 / .45)}
.login .logo-crop{width:184px;max-width:70%;height:126px;margin:4px auto 4px;overflow:hidden}
.login .logo{display:block;width:100%;height:auto}
.login .erp{text-align:center;font-size:13px;letter-spacing:.32em;font-weight:700;color:var(--navy);margin:0 0 18px;padding-left:.32em}
.login .foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px;font-size:12px;color:var(--muted)}
.login .foot b{letter-spacing:.12em;color:var(--navy)}
@media (prefers-color-scheme: dark){.login .logo-crop{background:#eef4f8;border-radius:10px}}
.top .mark{height:30px;width:auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em}
.brand .by{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 20px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.field input,.field select,.field textarea{width:100%;height:40px;padding:0 12px}
.field textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.btn{height:38px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:var(--surface);font-weight:600;padding:0 16px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--bad);font-size:13px;min-height:20px}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:56px;padding-block:8px}
.top .brand h1{font-size:17px}
.branch{display:flex;align-items:center;gap:8px;margin-left:auto}
.branch select{height:34px;padding:0 8px;max-width:240px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.lv{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.linkbtn{background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 57px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:9px 12px;cursor:pointer}
nav.side button[aria-current="page"]{background:var(--navy-soft);color:var(--navy);font-weight:600}
nav.side button:disabled{color:var(--muted);cursor:default;opacity:.6}
nav.side .soon{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px}
nav.side .sep{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:14px 12px 4px}
main{min-width:0;padding-block:20px 64px}
.wrap{max-width:min(1800px,100%);margin:0 auto;display:grid;gap:20px}
.page-h{display:flex;align-items:flex-end;justify-content:flex-start;gap:12px 28px;flex-wrap:wrap}
.srchbox{display:inline-flex;align-items:center;gap:4px;flex:none;max-width:100%}.srchbox input{min-width:0}
.page-h h2{margin:0;font-size:20px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.monthnav b{min-width:96px;text-align:center}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px;min-width:0}
.kpi:last-child{border-right:none}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.lead{background:var(--accent-soft)}
.up{color:#d93025} .down{color:#1a5fd0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.panel h3 span{font-size:12px;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.chart-box{overflow-x:auto}
.cbox{position:relative;height:260px}
.cbox.tall{height:320px}
.chart-box svg{display:block;min-width:620px;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-box{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk)}
tbody tr:hover{background:var(--sunk)}
tr.cur td{font-weight:600}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.wait{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.off{background:var(--sunk);color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;background:var(--navy)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;color:var(--muted);text-align:center}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px;margin:0;min-width:0}
legend{font-weight:600;padding:0 6px}
.fs-note{font-size:12px;color:var(--muted);margin:0 0 12px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
.row input{height:36px;padding:0 10px;text-align:right;width:100%;font-family:var(--f-num)}
.row.calc{border-top:1px dashed var(--line);padding-top:8px}
.row.calc output{text-align:right;font-family:var(--f-num);font-weight:600;padding-right:10px}
.gridDh,.gridD{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 110px;gap:8px;align-items:center}
.gridDh{font-size:11px;color:var(--muted);text-align:right}.gridDh span:first-child{text-align:left}
.gridD input{height:34px;padding:0 8px;text-align:right;width:100%;font-family:var(--f-num)}
.grid3h,.grid3{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,72px);gap:8px;align-items:center}
.grid2h,.grid2r{display:grid;grid-template-columns:minmax(0,1fr) repeat(2,80px);gap:8px;align-items:center}
.grid3h,.grid2h{font-size:11px;color:var(--muted);text-align:right}
.grid3h span:first-child,.grid2h span:first-child{text-align:left}
.grid3 input,.grid2r input{height:34px;padding:0 8px;text-align:right;width:100%;font-family:var(--f-num)}
.upload{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:flex-start;column-gap:20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.formbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:flex-start;column-gap:20px;flex-wrap:wrap;margin-bottom:env(safe-area-inset-bottom,0px)}
.check{font-size:13px;color:var(--muted)} .check.bad{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}

.cal{display:grid;grid-template-columns:minmax(0,1.1fr) repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cal > div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:74px;min-width:0;font-size:12px}
.cal .h{min-height:auto;background:var(--sunk);color:var(--muted);text-align:center;font-weight:500}
.cal .d b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.cal .d .v{font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:-.02em;word-break:break-all}
.cal .d.miss{background:color-mix(in srgb,var(--warn) 8%,transparent)}
.cal .d.out{background:var(--bg);color:var(--muted)}
.cal .d.fut{color:var(--muted)}
.cal .w{background:var(--navy-soft)}
.cal button.d{all:unset;box-sizing:border-box;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:74px;cursor:pointer;font-size:12px}
.cal button.d:hover{outline:2px solid var(--navy);outline-offset:-2px}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;display:grid;gap:4px}
.bcard:hover{border-color:var(--navy)}
.bcard b{font-size:15px} .bcard span{font-size:12px;color:var(--muted)}
.bcard:disabled{cursor:not-allowed;opacity:.6}
.form-grid input.just{background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.form-grid label[data-auto]::after{content:attr(data-auto);margin-left:6px;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--navy-soft);color:var(--navy);vertical-align:1px}
.form-grid label[data-auto="수정"]::after{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
table.fin input,table.fin select{height:30px;padding:0 6px}
table.fin th,table.fin td{text-align:left}
table.fin td.num{text-align:right}
table.fin tr.auto td{color:var(--muted);background:var(--sunk)}
table.fin tr.addrow td{background:color-mix(in srgb,var(--navy) 4%,var(--surface))}
.ahist{margin:0 0 10px}
.ahist:empty{display:none}
.ahist details{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--sunk);font-size:12px}
.ahist summary{cursor:pointer;font-weight:600}
.ahist table td,.ahist table th{padding:3px 6px;font-size:12px}
.btn.warnbtn{background:var(--warn);border-color:var(--warn)}
.hov{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface));border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:14px;white-space:pre-wrap}
.hov:empty{display:none}
.hov b{display:block;font-size:12px;color:var(--warn);margin-bottom:3px}
.bcard.hq{border-color:var(--navy);background:var(--navy-soft)}
.nbar{display:flex;gap:10px;align-items:center;justify-content:flex-start;column-gap:20px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 12px;background:var(--sunk);font-size:13px}
.mygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.mygrid{grid-template-columns:1fr}}
.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk7 div{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;min-height:54px}
.wk7 div.today{border-color:var(--navy);background:var(--navy-soft)}
.wk7 b{display:block;font-size:14px;margin-top:3px}
.report{max-width:900px;margin:0 auto;padding:28px 32px}
.report .rh{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:6px}
.report .rh h1{margin:0;font-size:22px;color:var(--navy)}.report .rh p{margin:4px 0 0;color:var(--muted);font-size:13px}.report .rh b{color:var(--navy);letter-spacing:.1em}
.report h2{font-size:15px;margin:22px 0 8px;color:var(--navy);border-left:4px solid var(--navy);padding-left:8px}
table.rpt{width:100%;border-collapse:collapse;margin:0 0 10px;font-size:13px}
table.rpt th{background:var(--sunk);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
table.rpt td{padding:6px 8px;border-bottom:1px solid var(--line)}table.rpt td.num{text-align:right;font-family:var(--f-num)}
.rnotes{margin:0;padding-left:18px;font-size:13px;white-space:pre-wrap}.rnotes li{margin:4px 0}
@media print{ body.printing-report .top, body.printing-report nav.side, body.printing-report .noprint, body.printing-report #toast{display:none!important}
  body.printing-report .shell{display:block} body.printing-report main{padding:0!important} body.printing-report .wrap{max-width:none;padding:0}
  body.printing-report .report{border:0;box-shadow:none;padding:0} body.printing-report table.rpt{page-break-inside:avoid} body.printing-report .report h2{page-break-after:avoid}
  @page{size:A4;margin:14mm} }
.alerts{display:grid;gap:6px;margin:0 0 14px}
.alert{display:flex;gap:10px;align-items:center;justify-content:flex-start;column-gap:20px;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:8px;padding:8px 12px;background:var(--surface);font-size:13.5px}
.alert.bad{border-left-color:var(--bad);background:color-mix(in srgb,var(--bad) 6%,var(--surface))}
.alert.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 7%,var(--surface))}
.alert.info{border-left-color:var(--accent)}
.alert .btn{flex:none}
.goals h3 span .linkbtn{font-size:12px}
.goalgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.goal .gh{display:flex;justify-content:space-between;gap:8px;font-size:13px}.goal .gh span{color:var(--muted);font-size:12px}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin:6px 0 4px;overflow:visible}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.gbar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.goal .gd{font-size:12px;color:var(--muted)}
.goalempty{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin:0 0 14px;font-size:13px;color:var(--muted)}
.trend h3 span b{font-size:13px}
.tlines{margin:0 0 6px;padding-left:20px;font-size:14px;line-height:1.8}
.trend .cbox{height:300px}
table.trendtbl tr.cur td{font-weight:600;background:var(--navy-soft)}
.shtab thead th,.sc-h{will-change:transform}
.shtab thead th.stuck,.sc-h.stuck{box-shadow:0 2px 0 var(--line)}
.blk{position:absolute;left:0;right:0;z-index:1;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--muted) 18%,transparent) 0 6px,color-mix(in srgb,var(--muted) 8%,transparent) 6px 12px);border-top:1px solid color-mix(in srgb,var(--muted) 35%,transparent);border-bottom:1px solid color-mix(in srgb,var(--muted) 35%,transparent);cursor:not-allowed;display:flex;align-items:flex-start;justify-content:center}
.blk span{font-size:10.5px;color:var(--muted);background:var(--surface);padding:0 4px;border-radius:3px;margin-top:2px}
.ap{z-index:2}
.ap.dragsrc{opacity:.35}
.ap.ghost{opacity:.9;box-shadow:0 8px 20px rgb(0 0 0 / .25);cursor:grabbing}
.dghint{position:fixed;z-index:60;background:var(--ink);color:var(--surface);font-size:12px;padding:3px 8px;border-radius:5px;pointer-events:none}
.ap em{font-style:normal;font-size:10px;margin-right:3px;padding:0 3px;border-radius:3px}
.ap em.nth,.nth{font-style:normal;font-weight:700;padding:0 4px;border-radius:3px;font-size:10.5px}
.nth.n1{background:#e3efff;color:#1a5fd0}.nth.n2{background:#e2f6e7;color:#1f7a3a}.nth.n3{background:#fff0d9;color:#b86200}
.ap.nth1{border-color:#1a5fd0;background:#eef5ff}.ap.nth2{border-color:#2f8f4e;background:#eaf7ee}.ap.nth3{border-color:#d17a12;background:#fff5e6}
.ap em.cti.o{background:#e2f6e7;color:#1f7a3a}.ap em.cti.x{background:#fde7e7;color:#c0392b}
.ckb{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:28px;border:1px solid var(--line);border-radius:6px;font-weight:700;cursor:pointer;color:var(--muted)}
.ckb.o{background:#e2f6e7;color:#1f7a3a;border-color:#9ed4ad}.ckb.x{background:#fde7e7;color:#c0392b;border-color:#f0b3ad}
.ckb:disabled{cursor:default}

  const f=x=>`${x.getUTCMonth()+1}.${String(x.getUTCDate()).padStart(2,"0")}`; return { key:ymd(mon), mon, sun, label:`${f(mon)}~${f(sun)}` }; }
function bindSearch(id,run){ const inp=$(id); if(!inp) return; inp.type="search"; inp.autocomplete="off";

async function doLogout(why){
  document.querySelectorAll("#logout,#lo").forEach(b=>{ b.disabled=true; b.textContent="로그아웃 중…"; });
  try{ if(window.__entryFlush) await Promise.race([window.__entryFlush(), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  try{ if(typeof shDirtyN==="function"&&shDirtyN()>0&&confirm(`근무표에 저장 안 한 칸이 ${shDirtyN()}개 있습니다. 저장하고 로그아웃할까요?`)) await shFlush(); }catch(e){}
  window.__entryFlush=null; window.onbeforeunload=null; clearTimeout(idleT);
  try{ await Promise.race([sb.auth.signOut({scope:"local"}), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  try{ Object.keys(localStorage).filter(k=>/^sb-.*auth-token/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{ Object.keys(sessionStorage).filter(k=>/^sb-.*auth-token/.test(k)).forEach(k=>sessionStorage.removeItem(k)); }catch(e){}
  try{ if(why==="idle") sessionStorage.setItem("gt-idle","1"); }catch(e){}
  location.replace(location.pathname);
}

async function boot(){
  bumpIdle();
  if(!S.user){ S.me=null; return renderLogin(); }
  const {data:me, error} = await sb.from("profiles").select("*").eq("user_id",S.user.id).maybeSingle();
  if(error || !me || !me.active){ return renderNoProfile(error); }
  S.me = me;
  const {data:brs} = await sb.from("branches").select("*").order("sort");
  S.branches = (brs||[]).filter(b=>b.active || b.id===me.branch_id);
  if(me.level===1){ const saved=lsGet("gt-branch"); S.branch = (saved==="__hq"||S.branches.find(b=>b.id===saved)) ? saved : null; }

}

function bucketize(rows,mode,md){

    else if(mode==="week"){ const w=weekOf(r.close_date); key=w.key; label=w.label; }

      <fieldset><legend>초진 내원경로 (문진표)</legend><div class="rows">${PATHS.map((p,i)=>num("fp"+i,p,r.paths?.[p])).join("")}</div></fieldset>
      <fieldset><legend>특이사항 · 인수인계</legend><div class="field" style="margin:0"><label for="f_note" class="meta">다음 날 대시보드·마이페이지 맨 위에 "전날 인수인계"로 보입니다 · 시재 차이 사유 등 (환자 개인정보는 적지 마세요)</label><textarea id="f_note" rows="5">${esc(r.note||"")}</textarea></div></fieldset>
    </div>
    <div class="formbar" style="margin-top:20px"><span class="check" id="chk"></span><span style="display:flex;gap:8px">${canDash()?`<button type="button" class="btn ghost" id="gocal">마감 달력 보기</button>`:""}<button type="submit" class="btn" id="save">지금 저장</button></span></div>
  </form></div>`;
  const v=id=>{ const el=$(id); if(!el) return 0; const s=(el.value||"").replace(/[^\d]/g,""); return s?Number(s):0; };
  const fmt=el=>{ const s=el.value.replace(/[^\d]/g,""); el.value=s?Number(s).toLocaleString("ko-KR"):""; };
  // ── 자동 저장: 바뀐 칸만 저장 ──
  const COL={f_total:"total",f_nonpay:"nonpay",f_out:"outpatient",f_inpat:"inpatient",f_surg:"surgery_cnt",f_card:"pay_card",f_cash:"pay_cash",f_free:"pay_free",f_acct:"pay_account",f_unpaid:"unpaid",f_unpaidIn:"unpaid_in",x_cash:"exp_cash",x_card:"exp_card",x_free:"exp_free",i_cash:"inc_cash",i_card:"inc_card",i_acct:"inc_account",f_note:"note"};
  const colOf=id=> COL[id] || (/^d[nra]\d/.test(id)?"doctors": /^r[vw]_/.test(id)?"resv": /^pt\d/.test(id)?"pt": /^fp\d/.test(id)?"paths": /^cx\d/.test(id)?"extra": null);
  const dirty=new Set(); let atimer=null, saving=null, savedOnce=!!row;
  const ptKeys=ptKeysEntry(); let ptManual=new Set((r.pt&&r.pt._m)||[]); let schedCnt=null;
  const buildAll=()=>{ const items={}; RESV_ITEMS.forEach((it,i)=>{ items[it]={resv:v(`rv_${i}_resv`),change:v(`rv_${i}_change`),cancel:v(`rv_${i}_cancel`)}; });
    const why={}; WHY.forEach((w,i)=>why[w]=v("rw_"+i)); const paths={}; PATHS.forEach((p,i)=>paths[p]=v("fp"+i));
    const doctors=[...document.querySelectorAll("[data-doc]")].map(el=>{ const i=el.dataset.doc; return {doctor_id:el.dataset.id?Number(el.dataset.id):null,name:el.dataset.name,new:v("dn"+i),re:v("dr"+i),amt:v("da"+i)}; }).filter(d=>d.new||d.re||d.amt);
    const pt=Object.fromEntries(ptKeys.map((k,i)=>[k,v("pt"+i)]).filter(x=>x[1])); if(ptManual.size) pt._m=[...ptManual];
    const o={ total:v("f_total"), nonpay:v("f_nonpay"), outpatient:v("f_out"), inpatient:v("f_inpat"), surgery_cnt:v("f_surg"),
      pay_card:v("f_card"), pay_cash:v("f_cash"), pay_account:v("f_acct"), unpaid:v("f_unpaid"), unpaid_in:v("f_unpaidIn"),
      exp_cash:v("x_cash"), exp_card:v("x_card"), exp_free:v("x_free"), inc_cash:v("i_cash"), inc_card:v("i_card"), inc_account:v("i_acct"),
      pay_free:v("f_free"), pt, resv:{...rv,items,real:v("rv_real"),visit:v("rv_visit"),why}, doctors, paths, note:$("f_note").value.trim()||null };
    if(CARM_ENTRY.includes(S.branch)) o.extra={...(r.extra||{}), carm:Object.fromEntries(CARM_KEYS.map((k,i)=>[k,v("cx"+i)]).filter(x=>x[1]))};
    return o; };
  const setAsv=(h)=>{ const x=$("asv"); if(x) x.innerHTML=h; };
  async function autosave(all){ clearTimeout(atimer); if(saving) await saving; if(!all&&!dirty.size) return true;
    const A=buildAll(); const payload={branch_id:S.branch, close_date:date}; (all?Object.keys(A).filter(k=>k!=="pt"||dirty.has("pt")||!schedCnt):[...dirty]).forEach(k=>payload[k]=A[k]); const keys=[...dirty]; dirty.clear();
    setAsv(`<span class="pill wait">저장 중…</span>`);
    saving=sb.from("daily_close").upsert(payload,{onConflict:"branch_id,close_date"}).then(({error})=>{ saving=null;
      if(error){ keys.forEach(k=>dirty.add(k)); setAsv(`<span class="pill bad">저장 안 됨</span> ${esc(errMsg(error))}`); toast("저장하지 못했습니다: "+errMsg(error)); return false; }
      savedOnce=true; setAsv(`<span class="pill ok">✓ 자동 저장됨</span> ${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`);
      main.querySelectorAll(".just").forEach(el=>el.classList.remove("just")); return true; });
    return saving; }
  const touch=(el)=>{ const c=colOf(el.id); if(!c) return; dirty.add(c); el.classList.add("just"); clearTimeout(atimer); atimer=setTimeout(()=>autosave(),1500); setAsv(`<span class="pill wait">입력 중…</span>`); };
  main.querySelectorAll("[data-n]").forEach(el=>{ el.addEventListener("input",()=>{ fmt(el); calc(); if(/^pt\d/.test(el.id)) { ptManual.add(ptKeys[+el.id.slice(2)]); ptHint(); } touch(el); }); el.addEventListener("change",()=>{ if(dirty.size) autosave(); }); });
  $("f_note").addEventListener("input",()=>touch($("f_note"))); $("f_note").addEventListener("change",()=>{ if(dirty.size) autosave(); });
  window.__entryFlush=()=>dirty.size?autosave():null;
  window.onbeforeunload=e=>{ if(window.__entryFlush&&dirty.size){ autosave(); e.preventDefault(); e.returnValue=""; } };
  $("edate").onchange=async()=>{ await autosave(); S.entryDate=$("edate").value; renderEntry(); };

  // ── 도수·충격파: 그날 스케줄 예약 건수 자동 반영 (손으로 고친 칸은 그대로) ──

    ptKeys.forEach((k,i)=>{ const el=$("pt"+i); if(!el) return; const lab=el.previousElementSibling; if(lab) lab.dataset.auto = ptManual.has(k)?"수정":"자동"; });
    if($("ptre")) $("ptre").onclick=()=>{ ptManual.clear(); applySched(true); }; }

    ptHint(); if(ch||force){ dirty.add("pt"); autosave(); } }
  if(CARM_ENTRY.includes(S.branch)) sb.from("carm_counts").select("kind,cnt").eq("branch_id",S.branch).eq("cdate",date).then(({data})=>{ const n=$("cxnote"); if(!n||!data||!data.length) return;
    const sm=k=>data.filter(x=>x.kind===k).reduce((a,x)=>a+(+x.cnt||0),0); n.textContent=`그날 건수 · 참고: 씨암 카운트 표(원장 기준) 씨암 ${sm("doc")} · 소관절 ${sm("doc_s")}`; });
  sb.from("appointments").select("item,status").eq("branch_id",S.branch).eq("kind","pt").eq("appt_date",date).then(({data,error})=>{
    if(error||!data||!data.length){ ptHint(); return; } schedCnt={}; data.filter(a=>!LOST_ST.has(a.status)).forEach(a=>{ const k=ptKeyOf(S.branch,a.item); schedCnt[k]=(schedCnt[k]||0)+1; }); applySched(false); });
  function calc(){
    const t=v("f_total"),np=v("f_nonpay"),o=v("f_out"),ip=v("f_inpat");
    $("o_np").textContent=t?pct(np,t):"–";
    const sc=$("o_sum"); if(t&&(o||ip)){ const ok=o+ip===t; sc.textContent=ok?"일치":"차이 "+won(o+ip-t)+"원"; sc.style.color=ok?"var(--good)":"var(--warn)"; } else { sc.textContent="–"; sc.style.color=""; }
    $("o_pay").textContent=won(v("f_card")+v("f_cash")+v("f_acct"))+"원";
    { const pd=t-(v("f_card")+v("f_cash")+v("f_acct")); const e=$("o_payd"); e.textContent=t?`${won(pd)}원`:"–"; }
    $("o_dn").textContent=won(docRows.reduce((a,_,i)=>a+v("dn"+i),0)); $("o_dr").textContent=won(docRows.reduce((a,_,i)=>a+v("dr"+i),0));
    { const da=docRows.reduce((a,_,i)=>a+v("da"+i),0), o=$("o_da"); o.textContent=da?won(da):"–"; o.title=da&&t?(da===t?"총진료비와 일치":`총진료비와 ${won(da-t)}원 차이`):""; o.style.color=da&&t&&da!==t?"var(--warn)":""; const dd=$("o_dad"); if(dd){ dd.textContent=da&&t?(da===t?"0원 · 일치":`${da-t>0?"+":""}${won(da-t)}원`):"–"; dd.style.color=da&&t?(da===t?"var(--good)":"var(--warn)"):""; } }
    $("o_rate").textContent=pct(v("rv_visit"),v("rv_real"));
    const c=$("chk"); const canc=RESV_ITEMS.reduce((a,_,i)=>a+v(`rv_${i}_cancel`),0), why=WHY.reduce((a,_,i)=>a+v("rw_"+i),0);
    if(!t){ c.textContent="총진료비는 원무 마감 후 입력하세요. 입력한 칸은 바로 저장됩니다."; c.className="check"; }
    else if(np>t){ c.textContent="비급여가 총진료비보다 큽니다. 숫자를 확인하세요."; c.className="check bad"; }
    else if(why && why!==canc){ c.textContent=`취소 사유 합계(${why})가 취소 건수 합계(${canc})와 다릅니다. 저장은 됩니다.`; c.className="check"; }
    else { c.textContent="입력한 칸은 자동으로 저장됩니다."; c.className="check"; }
  }
  calc();
  if(date<editFrom){ main.querySelectorAll("#ef input:not(#edate),#ef textarea,#ef select").forEach(el=>{ el.readOnly=true; el.disabled=el.tagName==="SELECT"; });
    ["save","nd_add"].forEach(id=>{ if($(id)) $(id).disabled=true; }); setAsv(`<span class="pill">보기 전용</span> 지난 마감일지는 볼 수만 있습니다 (어제·오늘만 수정)`); window.__entryFlush=null; }
  $("ef").addEventListener("submit", async e=>{
    e.preventDefault(); $("save").disabled=true; const ok=await autosave(true); $("save").disabled=false;
    if(ok){ const [,m,d]=date.split("-"); toast(`${+m}/${+d} 마감일지 저장됨${v("f_total")?"":" (총진료비는 아직 비어 있음)"}`); }
  });

const SCHED = { pt:{title:"도수·충격파 스케줄", from:540, to:1260}, emg:{title:"근전도 스케줄", from:540, to:1290} };
const SLOT_H = 18; // 10분당 px
const laneStep = (kind,l) => kind==="emg" ? 30 : (/충격/.test(((l&&l.grp)||"")+((l&&l.name)||"")) ? 10 : 30);
async function allRows(mk){ const out=[]; for(let i=0;;i+=1000){ const {data,error}=await mk().range(i,i+999); if(error) return {error}; out.push(...(data||[])); if(!data||data.length<1000) break; } return {data:out}; }
function schedRange(st){
  if(st.mode==="week"){ const s=mondayOf(st.date); return {start:s,end:addDays(s,6)}; }
  if(st.mode==="month"){ const R=monthRange(st.date.slice(0,7)); return {start:R.start,end:R.end}; }
  if(st.mode==="year"){ const y=st.date.slice(0,4); return {start:y+"-01-01",end:y+"-12-31"}; }
  if(st.mode==="range"){ st.from ||= st.date.slice(0,8)+"01"; st.to ||= monthRange(st.date.slice(0,7)).end; if(st.to<st.from) [st.from,st.to]=[st.to,st.from]; return {start:st.from,end:st.to}; }
  return {start:st.date,end:st.date};
}
function schedPerm(kind){
  const me=S.me; if(!me||!me.active) return "none"; if(me.level===1) return "edit";
  const p=me.perms&&me.perms["sched_"+kind]; if(p) return p;
  if(me.level<=3) return "edit";
  if(kind==="pt" && ["물리치료","원무"].includes(me.dept)) return "edit";
  if(kind==="emg" && ["임상병리","원무"].includes(me.dept)) return "edit";
  return "view";
}
const hhmm = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const ST_CLASS = {"예약":"ap-r","완료":"ap-d","취소":"ap-x","노쇼":"ap-x","변경":"ap-x"};
function mondayOf(iso){ return ymd(weekOf(iso).mon); }

    ? [...Array(7)].flatMap((_,i)=>{ const iso=addDays(start,i); const dd=new Date(iso+"T00:00:00Z"); const dn=`${+iso.slice(5,7)}/${+iso.slice(8)} (${WD[dd.getUTCDay()]})`;

  const timeCol=[...Array(rows/3+1)].map((_,i)=>{ const m=cfg.from+i*30; return `<div class="tl" style="top:${i*3*SLOT_H}px">${hhmm(m)}</div>`; }).join("");

    const n=Math.max(1,tracks.length);
    const cards=list.map(a=>{ const top=(a.start_min-cfg.from)/10*SLOT_H+1, h=Math.max(SLOT_H-2,a.minutes/10*SLOT_H-2);

    dlg.close(); toast(a?"예약을 고쳤습니다":`${hhmm(start)} 예약을 넣었습니다`); ctx.reload();

// ── 스케줄 통계 (월별) ──
async function renderSchedStats(kind){
  const main=$("main"); main.innerHTML=`<div class="wrap"><p class="meta">불러오는 중…</p></div>`;
  S.statMonth ||= kstToday().slice(0,7);
  const R=monthRange(S.statMonth); const endPlus=addDays(R.end,45);
  const [ar,ir]=await Promise.all([
    sb.from("appointments").select("*").eq("branch_id",S.branch).eq("kind",kind).gte("appt_date",addDays(R.start,-6)).lte("appt_date",endPlus).order("appt_date").order("start_min"),
    sb.from("sched_items").select("*").eq("branch_id",S.branch).eq("kind",kind).order("sort")]);
  if(ar.error){ main.innerHTML=`<div class="wrap"><div class="empty">${esc(errMsg(ar.error))}</div></div>`; return; }
  const items=ir.data||[], price=Object.fromEntries(items.map(i=>[i.name,i.price||0]));
  const all=ar.data||[], inM=all.filter(a=>a.appt_date>=R.start&&a.appt_date<=R.end);
  const live=inM.filter(a=>a.status==="예약"||a.status==="완료"), lost=inM.filter(a=>LOST_ST.has(a.status));
  const itemNames=[...new Set([...items.map(i=>i.name), ...live.map(a=>a.item)])].filter(n=>live.some(a=>a.item===n));
  const agg=list=>{ const o={n:list.length, nw:list.filter(a=>a.is_new).length, amt:list.reduce((s,a)=>s+(price[a.item]||0),0), by:{}}; o.re=o.n-o.nw; list.forEach(a=>o.by[a.item]=(o.by[a.item]||0)+1); return o; };
  // 신환 재방문율: 이 달 신환(차트번호 기준) 중 그 뒤 45일 안에 다시 예약(취소·노쇼 제외)한 비율
  const liveAll=all.filter(a=>a.status==="예약"||a.status==="완료");
  const newcomers=list=>{ const firsts=list.filter(a=>a.is_new&&a.chart_no); const back=firsts.filter(f=>liveAll.some(b=>b.chart_no===f.chart_no&&(b.appt_date>f.appt_date||(b.appt_date===f.appt_date&&b.start_min>f.start_min)))); return {n:firsts.length,back:back.length}; };
  const T=agg(live), TN=newcomers(live);
  const weekKeys=new Set(live.map(a=>weekOf(a.appt_date).key)); const weeks={}; liveAll.forEach(a=>{ const w=weekOf(a.appt_date); if(!weekKeys.has(w.key)) return; (weeks[w.key] ||= {label:w.label, mon:w.mon, sun:w.sun, list:[]}).list.push(a); });
  const W=Object.values(weeks).sort((a,b)=>a.mon-b.mon);
  const {data:actS}=await sb.from("staff").select("name").eq("branch_id",S.branch).eq("active",true); const activeSet=new Set((actS||[]).map(x=>x.name));
  const isRet=k=>k!=="(미지정)"&&!activeSet.has(k); S.statShowRet ??= true;
  const staffs={}; live.forEach(a=>{ (staffs[a.staff||"(미지정)"] ||= []).push(a); });
  const nRet=Object.keys(staffs).filter(isRet).length;
  const docs={}; if(kind==="emg"){ live.forEach(a=>{ if(a.doctor) (docs[a.doctor] ||= {order:0,needle:0}).order++; if(a.needle_doctor) (docs[a.needle_doctor] ||= {order:0,needle:0}).needle++; }); }
  const pctS=(a,b)=>b?(a/b*100).toFixed(1)+"%":"–";
  const head=`<tr><th>구분</th>${itemNames.map(n=>`<th>${esc(n)}</th>`).join("")}<th>총 건수</th><th>신환</th><th>재진</th><th>재진율</th><th>예상 매출</th></tr>`;
  const line=(label,o,cls="")=>`<tr class="${cls}"><td>${label}</td>${itemNames.map(n=>`<td class="num">${o.by[n]||0}</td>`).join("")}<td class="num"><b>${o.n}</b></td><td class="num">${o.nw}</td><td class="num">${o.re}</td><td class="num">${pctS(o.re,o.n)}</td><td class="num">${won(o.amt)}원</td></tr>`;
  main.innerHTML=`<div class="wrap">

// ── 전직원 근무 스케줄 ──
const SH_COLORS={blue:"var(--c-blue)",navy:"var(--c-navy)",teal:"var(--c-teal)",purple:"var(--c-purple)",gray:"var(--c-gray)",orange:"var(--c-orange)",red:"var(--c-red)",green:"#2e9e5b",pink:"#c2477d"};
// 근무 약자: A=9-22, D=9-19, E=14-22 (입력하면 시간으로 바꿔서 저장)
const SH_ALIAS={A:"9-22",D:"9-19",E:"14-22"};
const shAlias=v=>{ if(v==null) return v; const k=String(v).trim().toUpperCase(); return SH_ALIAS[k]||v; };
function shInterval(v,codes){ const c=codes[v]; if(c&&c.start_min!=null&&c.end_min!=null) return [c.start_min,c.end_min]; const t=String(v||"").match(/^\s*(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?\s*$/); if(!t) return null; const a=+t[1]*60+(+t[2]||0), b=+t[3]*60+(+t[4]||0); return b>a?[a,b]:null; }
// 팀장 공백 검사: 그날 팀장들의 근무가 9시~22시를 빈틈없이 덮는지
function leadGap(leads,map,d,codes){ const iv=leads.map(s=>map[s.id+"|"+d]).filter(h=>h&&!isOffVal(h.value,codes)).map(h=>shInterval(h.value,codes)).filter(Boolean).sort((a,b)=>a[0]-b[0]);
  let cur=540; const gaps=[]; for(const [a,b] of iv){ if(a>cur){ gaps.push([cur,Math.min(a,1320)]); } cur=Math.max(cur,b); if(cur>=1320) break; } if(cur<1320) gaps.push([cur,1320]); return gaps.filter(g=>g[1]>g[0]); }
const STAFF_DEPTS=["의료진","간호","수술","병동","원무","물리치료","영상의학","임상병리","경영지원"];
function canEditDept(dept){ const me=S.me; return me.level<=3 || me.perms?.sched_staff==="edit" || (me.level===3 && me.dept===dept); }
// 근무 시간: 13~14시는 점심이라 뺌 (13시에 시작하는 근무는 빼지 않음)
const lunchCut=(a,b)=>a===780?0:Math.max(0,Math.min(b,840)-Math.max(a,780));
function shiftHours(v,codes){ const c=codes[v]; if(c&&c.start_min!=null&&c.end_min!=null) return (c.end_min-c.start_min-lunchCut(c.start_min,c.end_min))/60;
  const t=String(v).match(/(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?/); if(!t) return 0; const a=+t[1]*60+(+t[2]||0), b=+t[3]*60+(+t[4]||0); return b>a?(b-a-lunchCut(a,b))/60:0; }
function shiftColor(v,codes){ const c=codes[v]; if(c) return SH_COLORS[c.color]||SH_COLORS.blue; if(/off|휴/i.test(v)) return SH_COLORS.gray; if(/연차|반차|학회|교육/.test(v)) return SH_COLORS.orange;
  const t=String(v).match(/(\d{1,2})(?::\d{2})?\s*-\s*(\d{1,2})/); if(t){ const a=+t[1], b=+t[2]; if(a>=17) return SH_COLORS.purple; if(a>=12) return SH_COLORS.teal; if(b>=21) return SH_COLORS.navy; return SH_COLORS.blue; } return SH_COLORS.blue; }
const DEPT_COLORS={"의료진":"#1858a8","간호":"#d0457a","병동":"#7656b8","수술":"#1c8c8c","원무":"#d17a12","물리치료":"#2f8f4e","영상의학":"#5b6fd6","임상병리":"#a35b2a","경영지원":"#6b7785"};
const deptColor=d=>DEPT_COLORS[d]||"#4a7fb5";
const isOffVal=(v,codes)=>{ const c=codes[v]; return c?c.is_off:/^(off|휴무?|연차|병가|학회)$/i.test(String(v).trim()); };

const DOC_DEPTS=["공통","회의록","원무","간호","병동","수술","물리치료","영상의학","임상병리","청구","경영지원"];

function mdRender(src,opt={}){
  const E=!!opt.edit; const L=i=>E?` data-ln="${i}"`:"";
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<i>$2</i>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const lines=String(src||"").split(/\r?\n/); let out="", list=null, tbl=null;
  const flushT=t=>{ const w=Math.max(...t.map(r=>r.c.length)); out+=`<div class="tbl-box"><table>${t.map((r,i)=>`<tr${L(r.ln)}>${r.c.map((c,ci)=>i===0?`<th data-ci="${ci}">${inl(c)}</th>`:`<td data-ci="${ci}">${inl(c)}</td>`).join("")}${E?`<td class="mdx">${i?`<button type="button" class="nmbtn" data-mdel="${r.ln}" title="이 줄 삭제" aria-label="이 줄 삭제">×</button>`:""}</td>`:""}</tr>`).join("")}</table></div>${E?`<button type="button" class="btn ghost sm mdadd" data-madd="${t[t.length-1].ln}" data-mw="${w}">+ 줄 추가</button>`:""}`; };
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } if(tbl){ const t=tbl; tbl=null; flushT(t); } };
  lines.forEach((raw,ln)=>{ const l=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(l)){ if(list){ out+=`</${list}>`; list=null; } const cells=l.trim().slice(1,-1).split("|").map(c=>c.trim()); if(cells.every(c=>/^:?-{2,}:?$/.test(c))) return; (tbl ||= []).push({c:cells,ln}); return; }
    if(tbl){ const t=tbl; tbl=null; flushT(t); }
    let m;
    if(/^-{3,}$/.test(l.trim())){ close(); out+="<hr>"; return; }
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){ close(); out+=`<h${m[1].length+2}${L(ln)} class="mdt">${inl(m[2])}</h${m[1].length+2}>`; return; }
    if((m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){ if(list!=="ul"){ close(); out+='<ul class="chk">'; list="ul"; } out+=`<li${L(ln)}><input type="checkbox" ${E?`data-mck="${ln}"`:"disabled"} ${m[1].trim()?"checked":""}> <span class="mdt"${L(ln)}>${inl(m[2])}</span></li>`; return; }
    if((m=l.match(/^\s*[-*•]\s+(.*)$/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+=`<li${L(ln)} class="mdt">${inl(m[1])}</li>`; return; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+=`<li${L(ln)} class="mdt">${inl(m[1])}</li>`; return; }
    close(); out+= l.trim() ? `<p${L(ln)} class="mdt">${inl(l)}</p>` : "";
  });
  close(); return out || `<p class="meta">내용이 없습니다.</p>`;
}
// 업무게시판: 보기 화면에서 바로 고치기 (표 칸·글 줄)
function bindMdEdit(box,doc,rerender){
  if(!box) return; let lines=String(doc.body||"").split(/\r?\n/); let timer=null, busy=false, dirty=false;
  const status=$("mdst"); const show=t=>{ if(status) status.textContent=t; };
  const save=async()=>{ clearTimeout(timer); if(!dirty||busy) return; busy=true; dirty=false; const body=lines.join("\n"); show("저장 중…");
    const {error}=await sb.from("dept_docs").update({body}).eq("id",doc.id); busy=false;
    if(error){ dirty=true; show("저장 실패 — "+errMsg(error)); toast(errMsg(error)); return; } doc.body=body; doc.updated_at=new Date().toISOString(); show("저장됨 ✓"); if(dirty) save(); };
  const queue=()=>{ dirty=true; show("저장 대기…"); clearTimeout(timer); timer=setTimeout(save,600); };
  window.__mdFlush=save;
  const cellsOf=ln=>lines[ln].trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  const setCell=(ln,ci,v)=>{ const c=cellsOf(ln); while(c.length<=ci) c.push(""); c[ci]=v.replace(/\|/g,"/").replace(/\s*\n\s*/g," ").trim(); lines[ln]="| "+c.join(" | ")+" |"; };
  const preOf=t=>(t.match(/^(\s*(?:#{1,3}\s+|[-*•]\s+(?:\[(?: |x|X)\]\s+)?|\d+[.)]\s+)?)/)||[""])[0];
  const edit=(el,get,put,next)=>{ if(el.querySelector(".mdin")) return; const old=get(); const w=el.offsetWidth;
    const ta=document.createElement("textarea"); ta.className="regin mdin"; ta.value=old; ta.rows=1; ta.style.minWidth=Math.max(80,w-8)+"px"; const keep=el.innerHTML; el.textContent=""; el.appendChild(ta); ta.focus(); ta.select();
    let done=false; const fin=sv=>{ if(done) return; done=true; const v=ta.value; if(sv&&v!==old){ put(v); queue(); el.textContent=v.replace(/\s*\n\s*/g," "); } else el.innerHTML=keep; };
    ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); fin(true); next&&next(e,"down"); } else if(e.key==="Escape"){ fin(false); } else if(e.key==="Tab"){ e.preventDefault(); fin(true); next&&next(e,e.shiftKey?"left":"right"); } };
    ta.onblur=()=>fin(true); };
  const cellEdit=td=>{ const tr=td.parentElement, ln=+tr.dataset.ln, ci=+td.dataset.ci;
    edit(td,()=>cellsOf(ln)[ci]??"",v=>setCell(ln,ci,v),(e,dir)=>{ let n=null;
      if(dir==="down") n=tr.nextElementSibling?.querySelector(`[data-ci="${ci}"]`); else if(dir==="right") n=td.nextElementSibling; else n=td.previousElementSibling;
      if(n&&n.dataset.ci!=null) setTimeout(()=>cellEdit(n),0); }); };
  box.querySelectorAll("tr[data-ln] [data-ci]").forEach(td=>{ td.tabIndex=0; td.addEventListener("click",e=>{ if(e.target.closest("a,.mdin")) return; cellEdit(td); }); td.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target===td){ e.preventDefault(); cellEdit(td); } }); });
  box.querySelectorAll(".mdt[data-ln]").forEach(el=>{ el.tabIndex=0; const ln=+el.dataset.ln; const go=()=>edit(el,()=>lines[ln].slice(preOf(lines[ln]).length),v=>{ lines[ln]=preOf(lines[ln])+v.replace(/\s*\n\s*/g," "); });
    el.addEventListener("click",e=>{ if(e.target.closest("a,.mdin,input")) return; e.stopPropagation(); go(); }); el.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target===el){ e.preventDefault(); go(); } }); });
  box.querySelectorAll("[data-mck]").forEach(cb=>cb.onchange=()=>{ const ln=+cb.dataset.mck; lines[ln]=lines[ln].replace(/\[( |x|X)\]/,cb.checked?"[x]":"[ ]"); queue(); });
  box.querySelectorAll("[data-madd]").forEach(b=>b.onclick=async()=>{ const ln=+b.dataset.madd, w=+b.dataset.mw; lines.splice(ln+1,0,"| "+Array(w).fill("").join(" | ")+" |"); dirty=true; await save(); rerender(); });
  box.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); if(!b.dataset.sure){ b.dataset.sure=1; b.textContent="삭제?"; b.style.opacity=1; b.style.color="var(--bad)"; return; } lines.splice(+b.dataset.mdel,1); dirty=true; await save(); rerender(); });
}

function docEditor(doc, dept, reload, st, notice){
  const v=$("dv");

const PII_COL=/환자|성함|생년|주민|연락|전화|휴대|핸드폰|주소/;

function preview(box,head,rows,n,bad,save,nSheets){

    ${bad.length?`<div class="check bad" style="margin-bottom:10px">${bad.slice(0,12).map(esc).join("<br>")}${bad.length>12?`<br>…외 ${bad.length-12}건`:""}</div>`:""}

          const {error}=await sb.from("register_rows").update({data,row_date:dateOf(data)}).eq("id",rid); if(error){ toast(errMsg(error)); td.textContent=old; return; } row.data=data; const rs=document.querySelector(".regsum"); if(rs&&(cols.find(c=>c.key===k)?.group||cols.find(c=>c.key===k)?.sum)) rs.outerHTML=regSum(); };
        ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); fin(true).then(()=>{ const nx=tr.nextElementSibling?.querySelector(`td[data-k="${k}"]`); if(nx) nx.click(); }); } else if(e.key==="Escape"){ fin(false); } else if(e.key==="Tab"){ e.preventDefault(); fin(true).then(()=>{ const n=e.shiftKey?td.previousElementSibling:td.nextElementSibling; if(n&&n.dataset.k) n.click(); }); } };

    document.querySelectorAll("[data-rdel]").forEach(b=>b.onclick=async()=>{ if(!b.dataset.sure){ b.dataset.sure=1; b.textContent="삭제?"; b.style.opacity=1; b.style.color="var(--bad)"; return; } const {error}=await sb.from("register_rows").delete().eq("id",b.dataset.rdel); if(error) return toast(errMsg(error)); b.closest("tr").remove(); });

    dlg.showModal(); let nc=cols.length; let order=cols.map((c,i)=>i); const keys=cols.map(c=>c.key);
    $("cadd").onclick=()=>{ let k; do{ k="c"+(nc++); }while(keys.includes(k)); keys.push(k); const i=keys.length-1; order.push(i); $("clist").insertAdjacentHTML("beforeend",`<div class="inline-form" style="margin-bottom:6px" data-ci="${i}"><input data-cl="${i}" value="" placeholder="새 열 이름" style="height:30px;flex:1;padding:0 8px"><label class="meta" style="display:flex;gap:4px;align-items:center"><input type="radio" name="cdate" value="${k}">날짜열</label><label class="meta" style="display:flex;gap:4px;align-items:center"><input type="radio" name="cgrp" value="${k}">이름별 집계</label><label class="meta" style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-csum value="${k}">합계</label></div>`); };
    $("cnogrp").onclick=()=>dlg.querySelectorAll('input[name="cgrp"]').forEach(x=>x.checked=false);

      const dc=dlg.querySelector('input[name="cdate"]:checked')?.value||null;
      const {error}=await sb.from("registers").update({name:$("cn").value.trim()||cur.name,columns,date_col:dc}).eq("id",cur.id); if(error) return toast(errMsg(error)); dlg.close(); renderRegisters(opts); };
  };
}

// ── 예약관리 ──
const VISITS=["내원","변경","취소"];
const RESV_WHY=["갑작스러운 일정","호전되어 안 와도 됨","개인사정(파악불가)","연락 안 됨","기타"];
async function renderResv(){

    const {data,error}=await sb.from("reservations").select("*").eq("branch_id",S.branch).eq("resv_date",st.date).order("resv_time").order("id");

    const d=new Date(st.date+"T00:00:00Z");
    main.innerHTML=`<div class="wrap">
      <div class="page-h"><div><h2>예약관리</h2><div class="meta">${+st.date.slice(5,7)}월 ${+st.date.slice(8)}일 (${WD[d.getUTCDay()]}) · EMR 예약 목록을 올린 뒤 내원 여부만 체크하세요 · 예약율 = 내원 ÷ (전체 − 변경)</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <div class="seg" role="group" aria-label="보기"><button data-rvm="day" aria-pressed="true">일별</button><button data-rvm="month" aria-pressed="false">월별 통계</button></div>
          <div class="monthnav"><button class="btn ghost sm" id="vp" aria-label="전날">◀</button><button class="btn ghost sm" id="vt">오늘</button><button class="btn ghost sm" id="vn" aria-label="다음날">▶</button></div>
          <input type="date" id="vd" value="${st.date}" style="height:30px;padding:0 6px" aria-label="날짜">

        <div class="kpi lead"><span class="k">예약율</span><span class="v num">${real?(c("내원")/real*100).toFixed(1):"–"}<small>%</small></span><span class="d">내원 ${c("내원")} / 실예약 ${real}</span></div>
        <div class="kpi"><span class="k">전체 예약</span><span class="v num">${all.length}</span><span class="d">확인 전 ${none}</span></div>
        <div class="kpi"><span class="k">내원</span><span class="v num" style="color:var(--good)">${c("내원")}</span></div>
        <div class="kpi"><span class="k">변경</span><span class="v num">${c("변경")}</span></div>
        <div class="kpi"><span class="k">취소·노쇼</span><span class="v num" style="color:var(--bad)">${c("취소")}</span></div>

        <div style="display:flex;gap:8px"><input id="vq" placeholder="차트번호·이름·메모" value="${esc(st.q)}" style="height:32px;padding:0 10px;width:170px"><button class="btn ghost sm" id="vadd">+ 예약 추가</button></div></div>
      <section class="panel" style="padding:0"><div class="tbl-box" style="max-height:calc(100vh - 330px)"><table class="resv"><thead><tr><th>시간</th><th>차트</th><th>환자명</th><th>주치의</th><th>예약메모</th><th>내원 여부</th><th>사유·비고</th><th></th></tr></thead><tbody>

    $("vup").onclick=()=>$("vf").click(); $("vf").onchange=()=>resvUpload($("vf").files[0],st);
  } else {

    const wS=mondayOf(R.start), wE=addDays(mondayOf(R.end),6);
    const {data,error}=await allRows(()=>sb.from("reservations").select("resv_date,visit,reason,subject").eq("branch_id",S.branch).gte("resv_date",wS).lte("resv_date",wE).order("id"));

        ${Object.entries(by).sort().map(([d,o])=>{ const x=new Date(d+"T00:00:00Z"); return `<tr><td><button class="linkbtn" data-gd="${d}">${+d.slice(5,7)}/${+d.slice(8)} (${WD[x.getUTCDay()]})</button></td><td class="num">${o.n}</td><td class="num">${o["내원"]}</td><td class="num">${o["변경"]}</td><td class="num">${o["취소"]}</td><td class="num">${o.none||""}</td><td class="num"><b>${rate(o)}</b></td></tr>`; }).join("")||`<tr><td colspan="7" class="meta">자료가 없습니다.</td></tr>`}
      </tbody></table></div></section></div>`;
    $("mp").onclick=()=>{ st.month=shiftMonth(st.month,-1); renderResv(); }; $("mn").onclick=()=>{ st.month=shiftMonth(st.month,1); renderResv(); };

// 근로기준법 제60조: 1년 미만은 1개월 개근마다 1일(최대 11일), 1년 이상 15일, 3년차부터 2년마다 1일 가산(최대 25일)
// 입사일 기준으로, 해당 연도(1~12월) 안에 생기는 연차를 합산합니다.
function addMonthsISO(iso,n){ const [y,m,d]=iso.split("-").map(Number); const t=new Date(Date.UTC(y,m-1+n,1)); const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate(); t.setUTCDate(Math.min(d,last)); return t.toISOString().slice(0,10); }

    let ann=0, yrs=0, annNext=null; for(let k=1;k<=45;k++){ const d=addMonthsISO(hire,12*k); if(d>ye) break; if(d>=ys){ if(d<=end){ ann=Math.min(25,15+Math.floor((k-1)/2)); yrs=k; } else if(!annNext) annNext={d,v:Math.min(25,15+Math.floor((k-1)/2))}; } }
    return {monthly,ann,yrs,next,annNext}; };

  const why=[A.monthly?`입사 후 만근 ${A.monthly}개월 → ${A.monthly}일`:"", A.ann?`${A.yrs}년 근속(${md(addMonthsISO(hire,12*A.yrs))}) ${A.ann}일`:""].filter(Boolean).join(" + ")||(cut<ye?"아직 만근한 달이 없습니다":`${year}년에 새로 생기는 연차 없음`);

  return {days:A.monthly+A.ann, full:F.monthly+F.ann, monthly:A.monthly, ann:A.ann, yrs:A.yrs, why, nextTxt}; }

function dcMoney(rows){ const s=k=>rows.reduce((a,r)=>a+(+r[k]||0),0);
  return {total:rows.filter(r=>+r.total>0).reduce((a,r)=>a+(+r.total||0),0), card:s("pay_card"), cash:s("pay_cash"), acct:s("pay_account"), pay:s("pay_card")+s("pay_cash")+s("pay_account"),
    inc:s("inc_cash")+s("inc_card")+s("inc_account"), exp:s("exp_cash")+s("exp_card")+s("exp_free"), days:rows.filter(r=>+r.total>0).length}; }
function finCalc(dc,E){ const sum=(k,f)=>E.filter(e=>e.kind===k&&(!f||f(e))).reduce((a,e)=>a+(+e.amount||0),0);
  const claim=sum("수입",e=>e.category==="공단 청구 입금"), other=sum("수입",e=>e.category!=="공단 청구 입금"), expIn=sum("지출");
  const expAll=expIn+dc.exp; const cashIn=dc.pay+dc.inc+claim+other;
  return {claim,other,expIn,expAll,cashIn,cashPL:cashIn-expAll,accrual:dc.total+dc.inc+other,accPL:dc.total+dc.inc+other-expAll}; }

async function apptConflicts(row, selfId, lanes){

  const out=[]; const s=row.start_min, e=s+row.minutes; const ln=id=>(lanes||[]).find(l=>l.id===id)?.name||"";
  (data||[]).filter(a=>a.id!==selfId&&!LOST_ST.has(a.status)).forEach(a=>{ const as=a.start_min, ae=as+(+a.minutes||0); const who=[a.chart_no,a.patient_name].filter(Boolean).join(" ")||"(이름 없음)"; const ov=as<e&&s<ae;
    if(a.lane_id===row.lane_id&&ov) out.push(`같은 방(${ln(a.lane_id)}) ${hhmm(as)}~${hhmm(ae)}에 ${who} · ${a.item} 예약이 있습니다`);

  return out;
}

// ── 목표 · 이상신호 ──
const GOAL_METRICS=[
  {k:"total",label:"총진료비",money:true},{k:"newP",label:"신환",u:"명"},{k:"visits",label:"총 진료 인원",u:"명"},

const ALERT_DEFS=[
  {k:"miss",label:"직전 영업일 마감일지가 비어 있음",th:null},
  {k:"sum",label:"외래+입원 ≠ 총진료비, 또는 원장별 진료비 합계 ≠ 총진료비",th:null},

  {k:"noshow",label:"최근 7일 스케줄 취소·노쇼율이 ○% 초과",th:15,u:"%"},

  {k:"notice",label:"필독 공지를 ○일 넘게 안 읽은 직원이 있음",th:3,u:"일"},
  {k:"pending",label:"연차·연장근무 확인 대기가 ○건 이상 (부서장에게)",th:1,u:"건"}];
async function loadBranchSettings(branch=S.branch){
  const {data}=await sb.from("branch_settings").select("data").eq("branch_id",branch).maybeSingle();
  const d=data?.data||{}; const alerts={}; ALERT_DEFS.forEach(a=>{ const s=(d.alerts||{})[a.k]||{}; alerts[a.k]={on:s.on!==false, th:s.th??a.th}; });
  return {alerts, sat:d.sat??0.5, holidays:Array.isArray(d.holidays)?d.holidays:[], raw:d};
}
function dayWeight(iso,set){ const dow=new Date(iso+"T00:00:00Z").getUTCDay(); if(dow===0) return 0; if(set.holidays.some(h=>h.d===iso)) return 0; return dow===6?+set.sat:1; }
function monthWorkdays(ym,set,cut){ const R=monthRange(ym); let done=0,left=0,all=0; for(let i=1;i<=R.days;i++){ const d=`${ym}-${String(i).padStart(2,"0")}`; const w=dayWeight(d,set); all+=w; if(cut&&d<=cut) done+=w; else left+=w; } return {all,done,left}; }
function goalActual(A){ return {total:A.total,newP:A.newP,visits:A.visits,pt:A.dosu+A.shock,nonpay:A.nonpay,npRate:A.npRate*100}; }
const fmtGoal=(m,v)=>m.money?wonMan(Math.round(v)):m.ratio?(+v).toFixed(1)+"%":won(Math.round(v))+(m.u||"");
const goalSlot=()=>`<div id="goalbox"></div><div id="alertbox"></div>`;

async function computeAlerts(set, opt={}){
  const today=kstToday(), out=[], lv=S.me.level, A=set.alerts;
  const canDc=canDash();
  if(canDc){
    const {data:rows0}=await sb.from("daily_close").select("close_date,total,nonpay,outpatient,inpatient,doctors,note").eq("branch_id",S.branch).gte("close_date",addDays(today,-40)).lte("close_date",today).order("close_date");
    const rows=(rows0||[]).slice().sort((x,y)=>x.close_date<y.close_date?-1:1); const closed=rows.filter(r=>+r.total>0); const by=Object.fromEntries(rows.map(r=>[r.close_date,r]));
    if(A.miss.on){ let d=addDays(today,-1), g=0; while(dayWeight(d,set)===0&&g<10){ d=addDays(d,-1); g++; }
      if(!(by[d]&&+by[d].total>0)) out.push({lvl:"bad",k:"miss",msg:`${+d.slice(5,7)}/${+d.slice(8)}(${WD[new Date(d+"T00:00:00Z").getUTCDay()]}) 마감일지가 아직 ${by[d]?"작성 중(총진료비 없음)":"입력되지 않았습니다"}`,go:canEntry()?{label:"마감일지 입력",fn:()=>{ S.entryDate=d; S.view="entry"; render(); }}:null}); }
    const last=closed.at(-1);
    if(last){ const ld=last.close_date, lab=`${+ld.slice(5,7)}/${+ld.slice(8)}`;
      if(A.sum.on){ const o=+last.outpatient||0, ip=+last.inpatient||0, t=+last.total; if((o||ip)&&o+ip!==t) out.push({lvl:"warn",k:"sum",msg:`${lab} 외래+입원(${won(o+ip)})이 총진료비(${won(t)})와 ${won(o+ip-t)}원 다릅니다`});
        const da=(last.doctors||[]).reduce((s,d)=>s+(+d.amt||0),0); if(da&&da!==t) out.push({lvl:"warn",k:"sum",msg:`${lab} 원장별 진료비 합계(${won(da)})가 총진료비와 ${won(da-t)}원 다릅니다`}); }
      const same=[1,2,3,4].map(w=>by[addDays(ld,-7*w)]).filter(r=>r&&+r.total>0);
      if(same.length>=2){ const avg=same.reduce((s,r)=>s+(+r.total),0)/same.length; const npAvg=same.reduce((s,r)=>s+(+r.nonpay)/(+r.total),0)/same.length*100; const np=(+last.nonpay)/(+last.total)*100;
        if(A.drop.on&&+last.total<avg*(1-A.drop.th/100)) out.push({lvl:"bad",k:"drop",msg:`${lab}(${WD[new Date(ld+"T00:00:00Z").getUTCDay()]}) 진료비 ${wonMan(+last.total)} — 최근 ${same.length}주 같은 요일 평균 ${wonMan(Math.round(avg))}보다 ${((1-(+last.total)/avg)*100).toFixed(0)}% 낮습니다`});
        if(A.npchg.on&&Math.abs(np-npAvg)>A.npchg.th) out.push({lvl:"warn",k:"npchg",msg:`${lab} 비급여 비중 ${np.toFixed(1)}% — 최근 같은 요일 평균 ${npAvg.toFixed(1)}%와 ${(np-npAvg>0?"+":"")+(np-npAvg).toFixed(1)}%p 차이`}); } }
    if(A.pace.on&&opt.goal&&opt.goal.W.done>=3){ opt.goal.items.filter(g=>!g.m.ratio&&g.target>0&&g.proj!=null).forEach(g=>{ if(g.proj<g.target*A.pace.th/100) out.push({lvl:"warn",k:"pace",msg:`${g.m.label}: 지금 속도면 월말 ${fmtGoal(g.m,g.proj)} (목표의 ${(g.proj/g.target*100).toFixed(0)}%) · 남은 영업일 하루 ${fmtGoal(g.m,g.need)} 필요`}); }); }
  }
  if(A.noshow.on&&(seeAll()||["물리치료","임상병리","원무"].includes(S.me.dept))){
    const {data:ap}=await sb.from("appointments").select("kind,status").eq("branch_id",S.branch).gte("appt_date",addDays(today,-7)).lt("appt_date",today);
    const L=ap||[]; const x=L.filter(a=>LOST_ST.has(a.status)).length; if(L.length>=10&&x/L.length*100>A.noshow.th) out.push({lvl:"warn",k:"noshow",msg:`최근 7일 스케줄 취소·노쇼 ${x}건 / ${L.length}건 (${(x/L.length*100).toFixed(1)}%)`,go:{label:"스케줄 보기",fn:()=>{ S.view="spt"; render(); }}});

async function computeGoal(set){
  const today=kstToday(), ym=today.slice(0,7), R=monthRange(ym);
  const [{data:tg},rows]=await Promise.all([ sb.from("branch_targets").select("metric,value").eq("branch_id",S.branch).eq("ym",ym), loadRange(R.start,R.end) ]);
  const T=Object.fromEntries((tg||[]).map(t=>[t.metric,+t.value]));
  const closed=rows.filter(r=>+r.total>0).sort((x,y)=>x.close_date<y.close_date?-1:1); const A=aggRows(closed); const act=goalActual(A); const cut=closed.at(-1)?.close_date||null;
  const W=monthWorkdays(ym,set,cut);
  const items=GOAL_METRICS.map(m=>{ const target=T[m.k]||0, a=act[m.k]||0; const proj=m.ratio?null:(W.done?a+a/W.done*W.left:null); const need=m.ratio?null:(W.left?Math.max(0,(target-a)/W.left):null);
    return {m,target,actual:a,proj,need,pct:target?(m.ratio?a/target:a/target)*100:null}; });

// ── 매출 추세 (같은 요일 / 주간) · 오르면 빨강, 내리면 파랑 ──
const RISE="#d93025", FALL="#1a5fd0";
const sgnPct=x=>(x>=0?"+":"")+(x*100).toFixed(1)+"%";
const updown=x=>x==null?"":`<b style="color:${x>=0?RISE:FALL}">${x>=0?"▲":"▼"} ${Math.abs(x*100).toFixed(1)}%</b>`;
function sameDowTrend(rows,d){
  const by=Object.fromEntries(rows.filter(r=>+r.total>0).map(r=>[r.close_date,+r.total]));
  const pts=[]; for(let k=4;k>=0;k--){ const day=addDays(d,-7*k); const amt=by[day]; const prev=[1,2,3,4].map(w=>by[addDays(day,-7*w)]).filter(v=>v);
    const base=prev.length>=2?prev.reduce((a,b)=>a+b,0)/prev.length:null; const dd=new Date(day+"T00:00:00Z");
    pts.push({label:`${String(+day.slice(5,7)).padStart(2,"0")}-${day.slice(8)}(${WD[dd.getUTCDay()]})`,day,amt:amt??null,base,pct:amt&&base?(amt-base)/base:null}); }
  const cur=pts.at(-1), wk=by[addDays(d,-7)];
  return {pts,cur,vsAvg:cur.pct,vsWeek:cur.amt&&wk?(cur.amt-wk)/wk:null,wkAmt:wk||null};
}
function weekTrend(B){
  const today=kstToday(); let f=B.length-1; while(f>=0&&addDays(B[f].key,6)>=today) f--; if(f<0) f=B.length-1; const tot=i=>B[i]?.a.total||0;
  const pts=[]; for(let i=f-4;i<=f;i++){ if(i<0) continue; const prev=[1,2,3,4].map(w=>i-w).filter(j=>j>=0).map(tot).filter(v=>v); const base=prev.length>=2?prev.reduce((a,b)=>a+b,0)/prev.length:null;
    pts.push({label:B[i].label,key:B[i].key,amt:tot(i)||null,base,pct:tot(i)&&base?(tot(i)-base)/base:null,days:B[i].a.days}); }
  const cur=pts.at(-1); const pw=f>0?tot(f-1):0; return {pts,cur,vsAvg:cur?.pct??null,vsWeek:cur&&pw?(cur.amt-pw)/pw:null,wkAmt:pw||null,focus:B[f]};
}
function trendPanel(id,title,T,kind){

const trendLabelPlugin={id:"trendLabels",afterDatasetsDraw(ch){ const ds=ch.data.datasets[0]; const meta=ch.getDatasetMeta(0); const ctx=ch.ctx; const P=ch.options.plugins.trendLabels?.pts||[];
  meta.data.forEach((el,i)=>{ const p=P[i]; if(!p||p.pct==null) return; const up=p.pct>=0, last=i===P.length-1; ctx.save(); ctx.textAlign="center"; ctx.fillStyle=up?RISE:FALL;

function drawTrend(id,T){

      pointRadius:P.map((_,i)=>i===P.length-1?7:4),pointBackgroundColor:P.map(p=>p.pct==null?ink:p.pct>=0?RISE:FALL),pointBorderColor:"#fff",pointBorderWidth:2}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:30,bottom:10,left:26,right:26}},plugins:{legend:{display:false},trendLabels:{pts:P},tooltip:{callbacks:{label:c=>{ const p=P[c.dataIndex]; return p.pct==null?"비교 자료 부족":[`매출 ${won(p.amt)}원`,`직전 4주 평균 ${won(Math.round(p.base))}원`,`증감 ${sgnPct(p.pct)}`]; }}}},
      scales:{x:{grid:{display:false},ticks:{color:ink}},y:{min:-mx,max:mx,grid:{color:c=>c.tick.value===0?"rgba(0,0,0,0)":grid},ticks:{color:ink,callback:v=>(v>0?"+":"")+Math.round(v)+"%"}}}},

function bindApptDrag(kind,cols,appts,cfg,lanes,blocks,reload){
  const grid=document.querySelector(".sc-grid"); if(!grid) return;
  document.querySelectorAll(".ap[data-ap]").forEach(card=>{
    card.addEventListener("pointerdown",ev=>{ if(ev.pointerType!=="mouse"||ev.button!==0) return; const a=appts.find(x=>x.id===+card.dataset.ap); if(!a) return;
      const sx=ev.clientX, sy=ev.clientY; const rect=card.getBoundingClientRect(); let drag=false, ghost=null, hint=null, target=null;
      const move=e=>{ const dx=e.clientX-sx, dy=e.clientY-sy; if(!drag&&Math.hypot(dx,dy)<6) return;
        if(!drag){ drag=true; card.classList.add("dragsrc"); ghost=card.cloneNode(true); ghost.classList.add("ghost"); ghost.style.cssText=`position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;pointer-events:none;z-index:50`; document.body.appendChild(ghost); hint=document.createElement("div"); hint.className="dghint"; document.body.appendChild(hint); }
        ghost.style.transform=`translate(${dx}px,${dy}px)`;
        const el=document.elementFromPoint(e.clientX,e.clientY); const body=el&&el.closest?el.closest(".sc-body[data-col]"):null; target=null;
        if(body){ const c=cols[+body.dataset.col]; const step=laneStep(kind,c.lane); const br=body.getBoundingClientRect(); const topY=e.clientY-br.top-(sy-rect.top); let m=cfg.from+Math.round(topY/(SLOT_H*step/10))*step; m=Math.max(cfg.from,Math.min(cfg.to-step,m)); target={c,m}; hint.textContent=`${+c.date.slice(5,7)}/${+c.date.slice(8)} ${c.lane.name} ${hhmm(m)}`; hint.style.left=(e.clientX+14)+"px"; hint.style.top=(e.clientY+12)+"px"; hint.hidden=false; } else hint.hidden=true; };
      const up=async e=>{ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); if(!drag) return;
        card.classList.remove("dragsrc"); ghost&&ghost.remove(); hint&&hint.remove(); card.dataset.nodlg="1"; setTimeout(()=>delete card.dataset.nodlg,300);
        if(!target) return; const nv={appt_date:target.c.date,lane_id:target.c.lane.id,start_min:target.m};

      window.addEventListener("pointermove",move); window.addEventListener("pointerup",up); });
  });
}

function cleanHtml(html){ const d=new DOMParser().parseFromString(`<div>${html||""}</div>`,"text/html"); const root=d.body.firstChild;
  root.querySelectorAll("script,style,iframe,object,embed,link,meta,form,input,button").forEach(x=>x.remove());
  root.querySelectorAll("*").forEach(el=>{ [...el.attributes].forEach(a=>{ const n=a.name.toLowerCase(), v=a.value.trim().toLowerCase();
    if(n.startsWith("on")) el.removeAttribute(a.name);
    else if((n==="src"||n==="href")&&!(v.startsWith("http")||v.startsWith("data:image/")||v.startsWith("#"))) el.removeAttribute(a.name);
    else if(!["src","href","alt","colspan","rowspan","style","target"].includes(n)) el.removeAttribute(a.name);
    else if(n==="style"&&/url\(|expression/i.test(v)) el.removeAttribute(a.name); }); });
  root.querySelectorAll("a").forEach(a=>{ a.target="_blank"; a.rel="noopener"; });
  return root.innerHTML; }

      if(e.key==="ArrowDown"){ e.preventDefault(); moveTo(p.r+1,p.c); return; } if(e.key==="ArrowUp"){ e.preventDefault(); moveTo(p.r-1,p.c); return; }
      if(e.key==="ArrowRight"||e.key==="ArrowLeft"||e.key==="Tab"){ e.preventDefault(); moveTo(p.r,p.c+((e.key==="ArrowLeft"||(e.key==="Tab"&&e.shiftKey))?-1:1)); return; }
      if(e.key==="Escape"){ sel=null; paint(); } });
    el.addEventListener("paste",async e=>{ const t=(e.clipboardData||window.clipboardData)?.getData("text")||""; if(!/[\t\n]/.test(t.trim())&&!multi()) return; e.preventDefault();
      const rows=t.replace(/\r/g,"").replace(/\n$/,"").split("\n").map(r=>r.split("\t").map(x=>+String(x).replace(/[^\d]/g,"")||0));
      const p=posOf(el.closest("td")); if(!p) return; if(multi()&&rows.length===1&&rows[0].length===1) return fillSel(rows[0][0]);
      const list=[]; rows.forEach((row,ri)=>row.forEach((v,ci)=>{ const i=p.G[p.r+ri]?.[p.c+ci]?.querySelector("input"); if(i) list.push({...keyOf(i),v}); }));
      if(await saveMany(list)){ toast(`${list.length}칸 붙여넣기`); again(); } });
    el.addEventListener("change",async()=>{ const k=keyOf(el); const v=+el.value||0; if((V[`${k.d}|${k.n}`]||0)===v) return; el.classList.add("saving");
      const ok=await saveMany([{...k,v}]); el.classList.remove("saving"); if(!ok){ el.classList.add("err"); return; } el.classList.remove("err"); el.classList.add("saved"); updTotals(el); }); });
  $("mxta").onclick=async()=>{ const n=$("mxt").value.trim(); if(!n) return toast("이름을 적어주세요"); const ex=allCols.find(c=>c.name===n);
    const res=ex ? await sb.from("mtx_cols").update({active:true,hidden_yms:(ex.hidden_yms||[]).filter(y=>y!==st.ym),first_ym:ex.first_ym&&ex.first_ym>st.ym?st.ym:ex.first_ym,last_ym:ex.last_ym&&ex.last_ym<st.ym?null:ex.last_ym}).eq("id",ex.id)
      : await sb.from("mtx_cols").insert({branch_id:S.branch,name:n,sort:Math.max(0,...allCols.map(c=>c.sort||0))+1,first_ym:st.ym,hidden_yms:[]});
    if(res.error) return toast(errMsg(res.error)); toast(ex?`${n} 다시 표시 (${R.m}월부터)`:`${n} 열 추가`); again(); };
  main.querySelectorAll("[data-mxdel]").forEach(b=>b.onclick=async()=>{ const c=allCols.find(x=>x.id===+b.dataset.mxdel); if(!c) return; const nIn=days.filter(d=>g(d,c.name)).length;
    if(!b.dataset.sure){ b.dataset.sure=1; b.textContent=nIn?`${R.m}월 ${nIn}칸 숫자도 숨김?`:`${R.m}월에서 뺄까요?`; return; }
    const {error}=await sb.from("mtx_cols").update({hidden_yms:[...new Set([...(c.hidden_yms||[]),st.ym])]}).eq("id",c.id); if(error) return toast(errMsg(error)); toast(`${c.name} — ${R.m}월에서만 뺐습니다 (다른 달은 그대로)`); again(); });
}
// ── 변경 기록 ──
async function renderLog(){
  const main=$("main"); main.innerHTML=`<div class="wrap"><p class="meta">불러오는 중…</p></div>`;
  const [{data:logs,error},{data:users}]=await Promise.all([ sb.from("audit_log").select("*").eq("branch_id",S.branch).order("at",{ascending:false}).limit(100), sb.from("profiles").select("user_id,name") ]);
  if(error){ main.innerHTML=`<div class="wrap"><div class="empty">${esc(errMsg(error))}</div></div>`; return; }
  const nm=id=>(users||[]).find(u=>u.user_id===id)?.name||"-";
  const A={appt_insert:"예약 추가",appt_update:"예약 수정",appt_delete:"예약 삭제",set_perms:"권한 변경",insert:"마감일지 입력",update:"마감일지 수정",create_user:"계정 생성",update_user:"계정 수정",reset_password:"비밀번호 재설정"};
  main.innerHTML=`<div class="wrap"><div class="page-h"><h2>변경 기록</h2><span class="meta">최근 100건</span></div>
    ${(logs||[]).length?`<section class="panel"><div class="tbl-box"><table><thead><tr><th>시각</th><th>누가</th><th>무엇을</th><th>대상</th></tr></thead><tbody>
    ${logs.map(l=>`<tr><td class="num">${esc(new Date(l.at).toLocaleString("ko-KR"))}</td><td>${esc(nm(l.user_id))}</td><td>${esc(A[l.action]||l.action)}</td><td class="num">${esc((l.target||"").replace("daily_close:",""))}</td></tr>`).join("")}</tbody></table></div></section>`:`<div class="empty">아직 기록이 없습니다.</div>`}</div>`;
}
})();
