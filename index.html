<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>골든타임 ERP</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1858a8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="골든타임">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 상단 바 + 좌측 메뉴(좁은 화면에서는 가로 탭) + 본문 */
/* 골든타임 브랜드: 로고의 블루(#1858a8)와 '365' 하늘색(#3fb4e0), 차콜 글자 */
:root{
  --bg:#eef4f8; --surface:#ffffff; --sunk:#e6eef4; --line:#d3dee7;
  --ink:#2b3137; --muted:#5f6b76; --accent:#2a9fd0; --accent-soft:#dff2fa;
  --navy:#1858a8; --navy-soft:#e1ebf7;
  --good:#2f7d4f; --warn:#b45309; --bad:#c0392b;
  --bar:#1858a8; --bar-weekend:#8fc6e6;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e151d; --surface:#151f2a; --sunk:#1b2733; --line:#283746;
  --ink:#e7edf3; --muted:#9db0c2; --accent:#5cc6ee; --accent-soft:#163647;
  --navy:#7fb0ee; --navy-soft:#1c3150;
  --good:#5cc08a; --warn:#f0a44b; --bad:#f07a6e;
  --bar:#6fa4e8; --bar-weekend:#2f6d90; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:linear-gradient(180deg,var(--accent-soft) 0%,var(--bg) 55%)}
.login{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:28px 28px 22px;box-shadow:0 10px 30px -18px rgb(24 88 168 / .45)}
.login .logo-crop{width:184px;max-width:70%;height:126px;margin:4px auto 4px;overflow:hidden}
.login .logo{display:block;width:100%;height:auto}
.login .erp{text-align:center;font-size:13px;letter-spacing:.32em;font-weight:700;color:var(--navy);margin:0 0 18px;padding-left:.32em}
.login .foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px;font-size:12px;color:var(--muted)}
.login .foot b{letter-spacing:.12em;color:var(--navy)}
@media (prefers-color-scheme: dark){.login .logo-crop{background:#eef4f8;border-radius:10px}}
.top .mark{height:30px;width:auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:22px;margin:0;letter-spacing:-.01em}
.brand .by{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.sub{color:var(--muted);margin:4px 0 20px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
input,select,textarea{border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.field input,.field select,.field textarea{width:100%;height:40px;padding:0 12px}
.field textarea{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.btn{height:38px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:var(--surface);font-weight:600;padding:0 16px;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--bad);font-size:13px;min-height:20px}

.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:56px;padding-block:8px}
.top .brand h1{font-size:17px}
.branch{display:flex;align-items:center;gap:8px;margin-left:auto}
.branch select{height:34px;padding:0 8px;max-width:240px}
.me{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.lv{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.linkbtn{background:none;border:none;color:var(--muted);cursor:pointer;text-decoration:underline;padding:0}
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 57px)}
nav.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
nav.side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:none;border-radius:6px;padding:9px 12px;cursor:pointer}
nav.side button[aria-current="page"]{background:var(--navy-soft);color:var(--navy);font-weight:600}
nav.side button:disabled{color:var(--muted);cursor:default;opacity:.6}
nav.side .soon{font-size:10px;border:1px solid var(--line);border-radius:3px;padding:0 4px}
nav.side .sep{font-size:11px;color:var(--muted);letter-spacing:.06em;padding:14px 12px 4px}
main{min-width:0;padding-block:20px 64px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:20px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h2{margin:0;font-size:20px;text-wrap:balance}
.meta{color:var(--muted);font-size:13px}
.monthnav{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.seg button{border:none;background:transparent;padding:6px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.monthnav b{min-width:96px;text-align:center}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);display:grid;gap:2px;min-width:0}
.kpi:last-child{border-right:none}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:2px}
.kpi .d{font-size:12px;color:var(--muted)}
.kpi.lead{background:var(--accent-soft)}
.up{color:var(--good)} .down{color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.panel h3 span{font-size:12px;color:var(--muted);font-weight:400}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.chart-box{overflow-x:auto}
.cbox{position:relative;height:260px}
.cbox.tall{height:320px}
.chart-box svg{display:block;min-width:620px;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-box{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:12px;color:var(--muted);font-weight:500;background:var(--sunk)}
tbody tr:hover{background:var(--sunk)}
tr.cur td{font-weight:600}
.pill{display:inline-block;font-size:11px;border-radius:999px;padding:1px 8px}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.wait{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.off{background:var(--sunk);color:var(--muted)}
.meter{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:4px}
.meter b{display:block;height:100%;background:var(--navy)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;color:var(--muted);text-align:center}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
fieldset{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px;margin:0;min-width:0}
legend{font-weight:600;padding:0 6px}
.fs-note{font-size:12px;color:var(--muted);margin:0 0 12px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center}
.row input{height:36px;padding:0 10px;text-align:right;width:100%;font-family:var(--f-num)}
.row.calc{border-top:1px dashed var(--line);padding-top:8px}
.row.calc output{text-align:right;font-family:var(--f-num);font-weight:600;padding-right:10px}
.gridDh,.gridD{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 110px;gap:8px;align-items:center}
.gridDh{font-size:11px;color:var(--muted);text-align:right}.gridDh span:first-child{text-align:left}
.gridD input{height:34px;padding:0 8px;text-align:right;width:100%;font-family:var(--f-num)}
.grid3h,.grid3{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,72px);gap:8px;align-items:center}
.grid2h,.grid2r{display:grid;grid-template-columns:minmax(0,1fr) repeat(2,80px);gap:8px;align-items:center}
.grid3h,.grid2h{font-size:11px;color:var(--muted);text-align:right}
.grid3h span:first-child,.grid2h span:first-child{text-align:left}
.grid3 input,.grid2r input{height:34px;padding:0 8px;text-align:right;width:100%;font-family:var(--f-num)}
.upload{border:1px dashed var(--line);border-radius:8px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:13px}
.formbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:env(safe-area-inset-bottom,0px)}
.check{font-size:13px;color:var(--muted)} .check.bad{color:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) minmax(0,1.1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.cal > div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:74px;min-width:0;font-size:12px}
.cal .h{min-height:auto;background:var(--sunk);color:var(--muted);text-align:center;font-weight:500}
.cal .d b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.cal .d .v{font-family:var(--f-num);font-weight:600;font-size:12px;letter-spacing:-.02em;word-break:break-all}
.cal .d.miss{background:color-mix(in srgb,var(--warn) 8%,transparent)}
.cal .d.out{background:var(--bg);color:var(--muted)}
.cal .d.fut{color:var(--muted)}
.cal .w{background:var(--navy-soft)}
.cal button.d{all:unset;box-sizing:border-box;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;min-height:74px;cursor:pointer;font-size:12px}
.cal button.d:hover{outline:2px solid var(--navy);outline-offset:-2px}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bcard{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;cursor:pointer;display:grid;gap:4px}
.bcard:hover{border-color:var(--navy)}
.bcard b{font-size:15px} .bcard span{font-size:12px;color:var(--muted)}
.bcard:disabled{cursor:not-allowed;opacity:.6}
.form-grid input.just{background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.form-grid label[data-auto]::after{content:attr(data-auto);margin-left:6px;font-size:10px;padding:1px 5px;border-radius:4px;background:var(--navy-soft);color:var(--navy);vertical-align:1px}
.form-grid label[data-auto="수정"]::after{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
table.fin input,table.fin select{height:30px;padding:0 6px}
table.fin th,table.fin td{text-align:left}
table.fin td.num{text-align:right}
table.fin tr.auto td{color:var(--muted);background:var(--sunk)}
table.fin tr.addrow td{background:color-mix(in srgb,var(--navy) 4%,var(--surface))}
.ahist{margin:0 0 10px}
.ahist:empty{display:none}
.ahist details{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--sunk);font-size:12px}
.ahist summary{cursor:pointer;font-weight:600}
.ahist table td,.ahist table th{padding:3px 6px;font-size:12px}
.btn.warnbtn{background:var(--warn);border-color:var(--warn)}
.hov{border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--surface));border-radius:8px;padding:10px 14px;margin:0 0 14px;font-size:14px;white-space:pre-wrap}
.hov:empty{display:none}
.hov b{display:block;font-size:12px;color:var(--warn);margin-bottom:3px}
.bcard.hq{border-color:var(--navy);background:var(--navy-soft)}
.nbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0 0 12px;background:var(--sunk);font-size:13px}
.mygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:900px){.mygrid{grid-template-columns:1fr}}
.wk7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk7 div{border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;min-height:54px}
.wk7 div.today{border-color:var(--navy);background:var(--navy-soft)}
.wk7 b{display:block;font-size:14px;margin-top:3px}
.report{max-width:900px;margin:0 auto;padding:28px 32px}
.report .rh{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:10px;margin-bottom:6px}
.report .rh h1{margin:0;font-size:22px;color:var(--navy)}.report .rh p{margin:4px 0 0;color:var(--muted);font-size:13px}.report .rh b{color:var(--navy);letter-spacing:.1em}
.report h2{font-size:15px;margin:22px 0 8px;color:var(--navy);border-left:4px solid var(--navy);padding-left:8px}
table.rpt{width:100%;border-collapse:collapse;margin:0 0 10px;font-size:13px}
table.rpt th{background:var(--sunk);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
table.rpt td{padding:6px 8px;border-bottom:1px solid var(--line)}table.rpt td.num{text-align:right;font-family:var(--f-num)}
.rnotes{margin:0;padding-left:18px;font-size:13px;white-space:pre-wrap}.rnotes li{margin:4px 0}
@media print{ body.printing-report .top, body.printing-report nav.side, body.printing-report .noprint, body.printing-report #toast{display:none!important}
  body.printing-report .shell{display:block} body.printing-report main{padding:0!important} body.printing-report .wrap{max-width:none;padding:0}
  body.printing-report .report{border:0;box-shadow:none;padding:0} body.printing-report table.rpt{page-break-inside:avoid} body.printing-report .report h2{page-break-after:avoid}
  @page{size:A4;margin:14mm} }
.inline-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end}
.inline-form .field{margin:0}
.inline-form .field input,.inline-form .field select{height:36px}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);padding:20px;width:min(440px,92vw)}
dialog::backdrop{background:rgb(0 0 0 / .35)}

.sc-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.sc-grid{display:grid;min-width:max-content}
.sc-col{border-right:1px solid var(--line);min-width:0}
.sc-col:last-child{border-right:none}
.sc-col.today .sc-h{background:var(--accent-soft);color:var(--navy)}
.sc-h{position:sticky;top:0;z-index:2;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--sunk);border-bottom:1px solid var(--line);font-size:13px;font-weight:600}
.sc-h small{font-size:10px;color:var(--muted);font-weight:400}
.sc-body{position:relative;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px 54px),repeating-linear-gradient(to bottom,color-mix(in srgb,var(--line) 45%,transparent) 0 1px,transparent 1px 18px)}
.sc-body[data-col]{cursor:copy}
.sc-time .sc-body{background-image:none}
.tl{position:absolute;right:6px;transform:translateY(-1px);font-family:var(--f-num);font-size:11px;color:var(--muted)}
.ap{position:absolute;overflow:hidden;text-align:left;border:1px solid var(--navy);border-left-width:3px;border-radius:5px;background:var(--navy-soft);color:var(--ink);padding:2px 5px;font-size:11px;line-height:1.3;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.ap b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap.ap-d{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.ap.ap-x{border-color:var(--line);background:var(--sunk);opacity:.7}
.ap.ap-x b{text-decoration:line-through}
.ap:hover{z-index:3;box-shadow:0 2px 8px rgb(0 0 0 / .15)}
.sc-note{padding:12px 16px}
.sc-notes{margin:0;padding-left:18px;display:grid;gap:4px}
details.panel summary{cursor:pointer}
.form-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.form-2 .field{margin-bottom:10px}
dialog{width:min(520px,94vw)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.side{flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px}
  nav.side .sep{display:none}
  nav.side button{width:auto;white-space:nowrap}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi{border-bottom:1px solid var(--line)}
  .kpi.lead{grid-column:1/-1}
  .grid2,.form-grid{grid-template-columns:minmax(0,1fr)}
  .branch{margin-left:0;width:100%}
  .cal{grid-template-columns:repeat(7,minmax(0,1fr))}
  .cal .w,.cal .wh{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.sc-col.dstart{border-left:2px solid var(--navy)}
.sc-h .sc-day{font-size:10px;color:var(--navy);font-weight:600}
:root{--c-blue:#2f6fca;--c-navy:#1b3f7a;--c-teal:#1c8c8c;--c-purple:#7656b8;--c-gray:#8a96a3;--c-orange:#d17a12;--c-red:#c0392b}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.fchip small{color:var(--muted);font-size:11px}
.fchip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.fchip[aria-pressed="true"] small{color:#dfe9f7}
.sh-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

async function doLogout(why){
  document.querySelectorAll("#logout,#lo").forEach(b=>{ b.disabled=true; b.textContent="로그아웃 중…"; });
  try{ if(window.__entryFlush) await Promise.race([window.__entryFlush(), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  window.__entryFlush=null; window.onbeforeunload=null; clearTimeout(idleT);
  try{ await Promise.race([sb.auth.signOut({scope:"local"}), new Promise(r=>setTimeout(r,1500))]); }catch(e){}
  try{ Object.keys(localStorage).filter(k=>/^sb-.*auth-token/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  try{ if(why==="idle") sessionStorage.setItem("gt-idle","1"); }catch(e){}
  location.replace(location.pathname);
}

function aggRows(rows){
  const a={days:rows.length,total:0,nonpay:0,out:0,inpat:0,surg:0,cash:0,free:0,newP:0,reP:0,real:0,visit:0,consult:0,pt:{},docs:{}};
  rows.forEach(r=>{ a.total+=+r.total; a.nonpay+=+r.nonpay; a.out+=+r.outpatient; a.inpat+=+r.inpatient; a.surg+=+r.surgery_cnt; a.cash+=+r.pay_cash; a.free+=+(r.pay_free||0);
    a.real+=+(r.resv?.real||0); a.visit+=+(r.resv?.visit||0); a.consult+=ptN(r,"도수상담");
    PT_ITEMS.forEach(k=>a.pt[k]=(a.pt[k]||0)+ptN(r,k));
    (r.doctors||[]).forEach(d=>{ const k=d.name||"기타"; (a.docs[k] ||= {nw:0,re:0,amt:0}); a.docs[k].nw+= +d.new||0; a.docs[k].re+= +d.re||0; a.docs[k].amt+= +d.amt||0; a.docAmt=(a.docAmt||0)+(+d.amt||0); a.newP+= +d.new||0; a.reP+= +d.re||0; }); });
  a.visits=a.newP+a.reP; a.perVisit=a.visits?a.total/a.visits:0; a.outPerVisit=a.visits?a.out/a.visits:0;
  a.npRate=a.total?a.nonpay/a.total:0; a.keep=a.real?a.visit/a.real:0;
  a.dosu=["도수A","도수B","도수C","도수E2A","도수E2B"].reduce((s,k)=>s+(a.pt[k]||0),0);
  a.shock=["충격파A","충격파B","충격파13","충격파18"].reduce((s,k)=>s+(a.pt[k]||0),0);
  return a;
}

const M=n=>(n/1e6); const fM=n=>man(n)+"백만";
function bucketize(rows,mode,md){
  const B=new Map();
  rows.forEach(r=>{ let key,label;
    if(mode==="day"){ key=r.close_date; const d=new Date(key+"T00:00:00Z"); label=md?`${d.getUTCMonth()+1}/${d.getUTCDate()}`:`${d.getUTCDate()}(${WD[d.getUTCDay()]})`; }
    else if(mode==="week"){ const w=weekOf(r.close_date); key=w.key; label=w.label.replace("주차","주"); }
    else if(mode==="month"){ key=r.close_date.slice(0,7); label=`${+key.slice(5)}월`; }
    else { key=r.close_date.slice(0,4); label=key+"년"; }
    if(!B.has(key)) B.set(key,{key,label,rows:[]}); B.get(key).rows.push(r); });
  return [...B.values()].sort((a,b)=>a.key<b.key?-1:1).map(b=>({...b,a:aggRows(b.rows)}));
}

// ── 마감 달력 ──
async function renderCal(){
  const main=$("main"); main.innerHTML=`<div class="wrap"><p class="meta">불러오는 중…</p></div>`;
  const R=monthRange(S.month); let rows;
  try{ rows=await loadRange(R.start,R.end); }catch(e){ main.innerHTML=`<div class="wrap"><div class="empty">${esc(errMsg(e))}</div></div>`; return; }
  const dept=false; const val=r=>+r.total;
  const draft=new Set(rows.filter(r=>!(+r.total>0)).map(r=>r.close_date));
  const by=Object.fromEntries(rows.filter(r=>+r.total>0).map(r=>[r.close_date,r])); const today=kstToday();
  const first=new Date(R.start+"T00:00:00Z"); const lead=(first.getUTCDay()+6)%7;
  const cells=[]; let wk={t:0,n:0,c:0};
  const hdr=["월","화","수","목","금","토","일"].map(d=>`<div class="h">${d}</div>`).join("")+`<div class="h wh">주 합계</div>`;
  const total=lead+R.days, cellsN=Math.ceil(total/7)*7;
  const dowAgg=[...Array(7)].map(()=>({t:0,n:0,c:0}));
  for(let i=0;i<cellsN;i++){
    const day=i-lead+1;
    if(day<1||day>R.days){ cells.push(`<div class="d out"></div>`); }
    else{ const iso=`${S.month}-${String(day).padStart(2,"0")}`; const r=by[iso];
      if(r){ const v=val(r), n=docsSum(r,"new"); wk.t+=v; wk.n+=n; wk.c++; const a=dowAgg[i%7]; a.t+=v; a.n+=n; a.c++;
        cells.push(`<button class="d" data-date="${iso}" title="${iso} 마감일지 열기"><b>${day}</b><span class="v">${wonMan(v)}</span><br><span class="meta">신환 ${n}</span></button>`); }
      else if(iso>today) cells.push(`<div class="d fut"><b>${day}</b></div>`);
      else cells.push(`<button class="d miss" data-date="${iso}" title="${iso} 마감일지 입력"><b>${day}</b><span class="pill wait">${draft.has(iso)?"작성 중":"미마감"}</span></button>`);
    }
    if(i%7===6){ cells.push(`<div class="w">${wk.c?`<span class="num"><b>${wonMan(wk.t)}</b></span><br><span class="meta">${wk.c}일 · 신환 ${wk.n}</span>`:""}</div>`); wk={t:0,n:0,c:0}; }
  }
  const missing=[...Array(R.days)].map((_,i)=>`${S.month}-${String(i+1).padStart(2,"0")}`).filter(iso=>iso<=today&&!by[iso]).length;
  main.innerHTML=`<div class="wrap">
    <div class="page-h"><div><h2>마감 달력</h2><div class="meta">${dept?"수납":"총진료비"} 만원 단위 · 칸을 누르면 그날 마감일지가 열립니다 · ${missing?`<b style="color:var(--warn)">미마감 ${missing}일</b>`:"빠진 날 없음"}</div></div>${monthNav()}</div>
    <div class="cal" role="grid">${hdr}${cells.join("")}</div>
    <section class="panel"><h3>요일별 평균 <span>${S.month.replace("-",". ")} 마감분</span></h3><div class="tbl-box"><table><thead><tr><th>요일</th>${["월","화","수","목","금","토","일"].map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>
      <tr><td>${dept?"수납":"진료비"}</td>${dowAgg.map(a=>`<td class="num">${a.c?wonMan(a.t/a.c):"–"}</td>`).join("")}</tr>
      <tr><td>신환(명)</td>${dowAgg.map(a=>`<td class="num">${a.c?(a.n/a.c).toFixed(1):"–"}</td>`).join("")}</tr>
      <tr><td>마감 일수</td>${dowAgg.map(a=>`<td class="num">${a.c}</td>`).join("")}</tr></tbody></table></div></section></div>`;
  bindMonthNav(renderCal);

}

        </div><div class="rows" style="margin-top:12px">

      <fieldset><legend>특이사항 · 인수인계</legend><div class="field" style="margin:0"><label for="f_note" class="meta">다음 날 대시보드·마이페이지 맨 위에 "전날 인수인계"로 보입니다 · 시재 차이 사유 등 (환자 개인정보는 적지 마세요)</label><textarea id="f_note" rows="5">${esc(r.note||"")}</textarea></div></fieldset>

  const v=id=>{ const el=$(id); if(!el) return 0; const s=(el.value||"").replace(/[^\d]/g,""); return s?Number(s):0; };
  const fmt=el=>{ const s=el.value.replace(/[^\d]/g,""); el.value=s?Number(s).toLocaleString("ko-KR"):""; };
  // ── 자동 저장: 바뀐 칸만 저장 ──
  const COL={f_total:"total",f_nonpay:"nonpay",f_out:"outpatient",f_inpat:"inpatient",f_surg:"surgery_cnt",f_card:"pay_card",f_cash:"pay_cash",f_free:"pay_free",f_acct:"pay_account",f_unpaid:"unpaid",f_unpaidIn:"unpaid_in",x_cash:"exp_cash",x_card:"exp_card",x_free:"exp_free",i_cash:"inc_cash",i_card:"inc_card",i_acct:"inc_account",f_note:"note"};
  const colOf=id=> COL[id] || (/^d[nra]\d/.test(id)?"doctors": /^r[vw]_/.test(id)?"resv": /^pt\d/.test(id)?"pt": /^fp\d/.test(id)?"paths": null);
  const dirty=new Set(); let atimer=null, saving=null, savedOnce=!!row;

    const pt=Object.fromEntries(ptKeys.map((k,i)=>[k,v("pt"+i)]).filter(x=>x[1])); if(ptManual.size) pt._m=[...ptManual];

    return saving; }

    ptHint(); if(ch||force){ dirty.add("pt"); autosave(); } }
  sb.from("appointments").select("item,status").eq("branch_id",S.branch).eq("kind","pt").eq("appt_date",date).then(({data,error})=>{
    if(error||!data||!data.length){ ptHint(); return; } schedCnt={}; data.filter(a=>a.status!=="취소"&&a.status!=="노쇼").forEach(a=>schedCnt[a.item]=(schedCnt[a.item]||0)+1); applySched(false); });

    $("o_np").textContent=t?pct(np,t):"–";
    const sc=$("o_sum"); if(t&&(o||ip)){ const ok=o+ip===t; sc.textContent=ok?"일치":"차이 "+won(o+ip-t)+"원"; sc.style.color=ok?"var(--good)":"var(--warn)"; } else { sc.textContent="–"; sc.style.color=""; }

    { const da=docRows.reduce((a,_,i)=>a+v("da"+i),0), o=$("o_da"); o.textContent=da?won(da):"–"; o.title=da&&t?(da===t?"총진료비와 일치":`총진료비와 ${won(da-t)}원 차이`):""; o.style.color=da&&t&&da!==t?"var(--warn)":""; }

// ── 스케줄 (도수·충격파 / 근전도) ──
const SCHED = { pt:{title:"도수·충격파 스케줄", from:540, to:1260}, emg:{title:"근전도 스케줄", from:540, to:1290} };
const SLOT_H = 18; // 10분당 px
const laneStep = (kind,l) => kind==="emg" ? 30 : (/충격/.test(((l&&l.grp)||"")+((l&&l.name)||"")) ? 10 : 30);
async function allRows(mk){ const out=[]; for(let i=0;;i+=1000){ const {data,error}=await mk().range(i,i+999); if(error) return {error}; out.push(...(data||[])); if(!data||data.length<1000) break; } return {data:out}; }
function schedRange(st){
  if(st.mode==="week"){ const s=mondayOf(st.date); return {start:s,end:addDays(s,6)}; }
  if(st.mode==="month"){ const R=monthRange(st.date.slice(0,7)); return {start:R.start,end:R.end}; }
  if(st.mode==="year"){ const y=st.date.slice(0,4); return {start:y+"-01-01",end:y+"-12-31"}; }
  if(st.mode==="range"){ st.from ||= st.date.slice(0,8)+"01"; st.to ||= monthRange(st.date.slice(0,7)).end; if(st.to<st.from) [st.from,st.to]=[st.to,st.from]; return {start:st.from,end:st.to}; }
  return {start:st.date,end:st.date};
}
function schedPerm(kind){
  const me=S.me; if(!me||!me.active) return "none"; if(me.level===1) return "edit";
  const p=me.perms&&me.perms["sched_"+kind]; if(p) return p;
  if(me.level===2) return "edit";
  if(kind==="pt" && ["물리치료","원무"].includes(me.dept)) return "edit";
  if(kind==="emg" && ["임상병리","원무"].includes(me.dept)) return "edit";
  return "view";
}
const hhmm = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const ST_CLASS = {"예약":"ap-r","완료":"ap-d","취소":"ap-x","노쇼":"ap-x"};
function mondayOf(iso){ return ymd(weekOf(iso).mon); }

async function renderSched(kind){

  const perm=schedPerm(kind), canEdit=perm==="edit", cfg=SCHED[kind];
  const {start,end}=schedRange(st); const grid = st.mode==="day"||st.mode==="week";

  const lanes=(lr.data||[]).filter(l=>l.active), items=ir.data||[], appts=ar.data||[], notes=nr.data||[];

  const docNames=(dr.data||[]).filter(d=>d.active).map(d=>d.name);
  const staffNames=[...new Set(appts.map(a=>a.staff).filter(Boolean))];
  const d0=new Date(st.date+"T00:00:00Z");
  const md=iso=>`${+iso.slice(5,7)}/${+iso.slice(8)}`;

  const rows=(cfg.to-cfg.from)/10, H=rows*SLOT_H;

  const cols = st.mode==="week"
    ? [...Array(7)].flatMap((_,i)=>{ const iso=addDays(start,i); const dd=new Date(iso+"T00:00:00Z"); const dn=`${+iso.slice(5,7)}/${+iso.slice(8)} (${WD[dd.getUTCDay()]})`;
        return lanes.map((l,li)=>({key:iso+"l"+l.id, name:lanes.length>1?l.name:dn, day:lanes.length>1?dn:"", dstart:li===0&&i>0, date:iso, lane:l, today:iso===kstToday()})); })
    : lanes.map(l=>({key:"l"+l.id, name:l.name, grp:l.grp, date:st.date, lane:l}));
  const firstLane=lanes[0]?.id;
  const inCol=(a,c)=> a.appt_date===c.date && (a.lane_id===c.lane.id || (!lanes.some(l=>l.id===a.lane_id) && c.lane.id===firstLane));
  const timeCol=[...Array(rows/3+1)].map((_,i)=>{ const m=cfg.from+i*30; return `<div class="tl" style="top:${i*3*SLOT_H}px">${hhmm(m)}</div>`; }).join("");

      return `<button class="ap ${ST_CLASS[a.status]||""}${h<SLOT_H*2-2?" one":""}" data-ap="${a.id}" style="top:${top}px;height:${h}px;left:calc(${a._t/n*100}% + 2px);width:calc(${100/n}% - 4px)" title="${esc(hhmm(a.start_min))} ${esc(a.chart_no||"")} ${esc(a.patient_name||"")} · ${esc(a.item)} · ${esc(a.staff||"")}">
        <b>${hhmm(a.start_min)} ${esc(a.chart_no||"")} ${esc(a.patient_name||"")}</b><span>${esc(a.item)}${a.is_new?" · 신환":""}${a.inpatient?" · 입원":""}${a.staff?" · "+esc(a.staff):""}${a.doctor?" · "+esc(a.doctor):""}${a.needle_doctor?" · 니들링 "+esc(a.needle_doctor):""}${laneName?" · "+esc(laneName):""}${a.status!=="예약"?" · "+a.status:""}</span></button>`; }).join("");

  // 집계
  const live=appts.filter(a=>a.status!=="취소"&&a.status!=="노쇼");
  const byItem=items.map(i=>{ const L=appts.filter(a=>a.item===i.name); const ok=L.filter(a=>a.status==="예약"||a.status==="완료");

  const other=appts.filter(a=>!itemBy[a.item]); if(other.length) byItem.push({name:"기타",r:other.filter(a=>a.status==="예약").length,d:other.filter(a=>a.status==="완료").length,x:other.filter(a=>a.status==="취소"||a.status==="노쇼").length,amt:0});
  const byStaff={}; live.forEach(a=>{ const k=a.staff||"(미지정)"; (byStaff[k] ||= {n:0,nw:0,amt:0}); byStaff[k].n++; if(a.is_new) byStaff[k].nw++; byStaff[k].amt+=itemBy[a.item]?.price||0; });
  const totAmt=byItem.reduce((s,x)=>s+x.amt,0);
  const noteRows = st.mode==="week" ? notes.filter(n=>n.note).map(n=>`<li><b>${+n.note_date.slice(5,7)}/${+n.note_date.slice(8)}</b> ${esc(n.note)}</li>`).join("") : "";

  const agg=L=>{ const lv=L.filter(a=>a.status!=="취소"&&a.status!=="노쇼"); return {n:lv.length,x:L.length-lv.length,nw:lv.filter(a=>a.is_new).length,d:lv.filter(a=>a.status==="완료").length,amt:lv.reduce((s,a)=>s+(itemBy[a.item]?.price||0),0)}; };
  const byDate={}; appts.forEach(a=>(byDate[a.appt_date] ||= []).push(a));

    periodHtml=`<div class="mcal">${["월","화","수","목","금","토","일"].map(w=>`<div class="h${w==="일"?" sun":""}">${w}</div>`).join("")}${cells.join("")}</div><p class="meta" style="margin-top:6px">날짜를 누르면 그날 방별 시간표로 갑니다.</p>`;

  main.innerHTML=`<div class="wrap">
    <div class="page-h"><div><h2>${cfg.title}</h2><div class="meta">${perm==="edit"?"빈 칸을 누르면 예약을 넣고, 예약을 누르면 고칠 수 있습니다":"보기 전용 권한입니다"} · 예약 ${live.length}건${appts.length-live.length?` · 취소/노쇼 ${appts.length-live.length}건`:""}</div></div>

        ${canEdit?`<button class="btn sm" id="sa">+ 예약 추가</button>`:""}
      </div></div>
    ${st.mode!=="day"&&st.mode!=="week"?"":st.mode==="day"?`<section class="panel sc-note"><label for="dn" class="meta">당직 · 휴무 · 전달사항 (그날 메모)</label><div style="display:flex;gap:8px;margin-top:6px"><input id="dn" value="${esc(dayNote)}" ${canEdit?"":"readonly"} placeholder="예: 야간 당직 김○○ (오전 휴무), 점심 당직 이○○" style="flex:1;height:34px;padding:0 10px">${canEdit?`<button class="btn ghost sm" id="dns">메모 저장</button>`:""}</div></section>`:(noteRows?`<section class="panel"><h3>이번 주 메모</h3><ul class="sc-notes">${noteRows}</ul></section>`:"")}
    ${!grid?periodHtml:!cols.length?`<div class="empty">설정된 방이 없습니다. 아래 방·치료항목 설정에서 방을 추가하세요.</div>`:
    `<div class="sc-wrap"><div class="sc-grid" style="grid-template-columns:52px repeat(${cols.length},minmax(${st.mode==="week"?(lanes.length>1?92:120):150}px,1fr))">
      <div class="sc-col sc-time"><div class="sc-h"></div><div class="sc-body" style="height:${H}px">${timeCol}</div></div>${colHtml}</div></div>`}
    <div class="grid2">
      <section class="panel"><h3>치료별 집계 <span>${periodName} · 예상 매출은 예약+완료 × 단가</span></h3>${byItem.length?`<div class="tbl-box"><table><thead><tr><th>치료</th><th>예약</th><th>완료</th><th>취소·노쇼</th><th>예상 매출</th></tr></thead><tbody>
        ${byItem.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${x.r}</td><td class="num">${x.d}</td><td class="num">${x.x}</td><td class="num">${won(x.amt)}원</td></tr>`).join("")}
        <tr class="cur"><td>합계</td><td class="num">${byItem.reduce((s,x)=>s+x.r,0)}</td><td class="num">${byItem.reduce((s,x)=>s+x.d,0)}</td><td class="num">${byItem.reduce((s,x)=>s+x.x,0)}</td><td class="num">${won(totAmt)}원</td></tr></tbody></table></div>`:`<p class="meta">예약이 없습니다.</p>`}</section>
      <section class="panel"><h3>담당자별 <span>취소·노쇼 제외</span></h3>${Object.keys(byStaff).length?`<div class="tbl-box"><table><thead><tr><th>담당</th><th>건수</th><th>신환</th><th>예상 매출</th></tr></thead><tbody>
        ${Object.entries(byStaff).sort((a,b)=>b[1].n-a[1].n).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${v.nw}</td><td class="num">${won(v.amt)}원</td></tr>`).join("")}</tbody></table></div>`:`<p class="meta">예약이 없습니다.</p>`}</section>
    </div>
    ${S.me.level<=2?`<details class="panel"><summary><b>방·치료항목 설정</b> <span class="meta">방 이름, 치료별 소요시간·단가</span></summary><div class="grid2" style="margin-top:12px">
      <div><h3 style="font-size:14px">방(열)</h3><div class="tbl-box"><table><thead><tr><th>이름</th><th>구분</th><th>순서</th><th></th></tr></thead><tbody>
        ${(lr.data||[]).map(l=>`<tr><td><input data-ln="${l.id}" value="${esc(l.name)}" style="height:30px;width:120px;padding:0 6px"></td><td><input data-lg="${l.id}" value="${esc(l.grp||"")}" style="height:30px;width:90px;padding:0 6px"></td><td><input data-ls="${l.id}" value="${l.sort}" inputmode="numeric" style="height:30px;width:48px;padding:0 6px;text-align:right"></td><td><button class="btn ghost sm" data-lsave="${l.id}">저장</button> <button class="btn ghost sm" data-lact="${l.id}" data-v="${l.active?0:1}">${l.active?"숨기기":"보이기"}</button></td></tr>`).join("")}
        <tr><td><input id="nl" placeholder="새 방 이름" style="height:30px;width:120px;padding:0 6px"></td><td><input id="nlg" placeholder="구분" style="height:30px;width:90px;padding:0 6px"></td><td></td><td><button class="btn sm" id="nla">추가</button></td></tr></tbody></table></div></div>
      <div><h3 style="font-size:14px">치료항목</h3><div class="tbl-box"><table><thead><tr><th>이름</th><th>분</th><th>단가(원)</th><th></th></tr></thead><tbody>
        ${items.map(i=>`<tr><td><input data-in="${i.id}" value="${esc(i.name)}" style="height:30px;width:110px;padding:0 6px"></td><td><input data-im="${i.id}" value="${i.minutes}" inputmode="numeric" style="height:30px;width:52px;padding:0 6px;text-align:right"></td><td><input data-ip="${i.id}" value="${i.price}" inputmode="numeric" style="height:30px;width:90px;padding:0 6px;text-align:right"></td><td><button class="btn ghost sm" data-isave="${i.id}">저장</button> <button class="btn ghost sm" data-iact="${i.id}" data-v="${i.active?0:1}">${i.active?"숨기기":"보이기"}</button></td></tr>`).join("")}
        <tr><td><input id="ni" placeholder="새 치료" style="height:30px;width:110px;padding:0 6px"></td><td><input id="nim" value="30" style="height:30px;width:52px;padding:0 6px;text-align:right"></td><td><input id="nip" value="0" style="height:30px;width:90px;padding:0 6px;text-align:right"></td><td><button class="btn sm" id="nia">추가</button></td></tr></tbody></table></div></div>
    </div></details>`:""}
  </div>`;
  const go=d=>{ st.date=d; renderSched(kind); };
  const shift=n=>{ if(st.mode==="week") return go(addDays(st.date,7*n)); if(st.mode==="month") return go(shiftMonth(st.date.slice(0,7),n)+"-01"); if(st.mode==="year") return go((+st.date.slice(0,4)+n)+"-01-01");
    if(st.mode==="range"){ const len=Math.round((new Date(end)-new Date(start))/864e5)+1; st.from=addDays(start,len*n); st.to=addDays(end,len*n); return renderSched(kind); } go(addDays(st.date,n)); };
  $("sp").onclick=()=>shift(-1); $("sn").onclick=()=>shift(1);
  $("st").onclick=()=>{ if(st.mode==="range"){ st.from=st.to=null; } go(kstToday()); };
  if($("sd")) $("sd").onchange=()=>{ if($("sd").value) go($("sd").value); };
  if($("sm")) $("sm").onchange=()=>{ if($("sm").value) go($("sm").value+"-01"); };
  if($("sy")) $("sy").onchange=()=>go($("sy").value+"-01-01");
  if($("rf")) { const rr=()=>{ if($("rf").value&&$("rt").value){ st.from=$("rf").value; st.to=$("rt").value; renderSched(kind); } }; $("rf").onchange=rr; $("rt").onchange=rr; }

      apptDialog(ctx,null,{date:c.date,start:Math.min(m,cfg.to-step),lane:c.lane?c.lane.id:lanes[0]?.id}); });

  if($("nia")) $("nia").onclick=async()=>{ const name=$("ni").value.trim(); if(!name) return; const {error}=await sb.from("sched_items").insert({branch_id:S.branch,kind,name,minutes:+$("nim").value||30,price:+String($("nip").value).replace(/[^\d]/g,"")||0,sort:items.length+1}); if(error) toast(errMsg(error)); else renderSched(kind); };
}

function apptDialog(ctx, a, preset){
  const {kind,lanes,items,itemBy,docNames,staffNames,canEdit,cfg}=ctx; const dlg=$("dlg");
  const v = a || {appt_date:preset.date,start_min:preset.start,lane_id:preset.lane,minutes:(items.find(i=>i.active)?.minutes)||30,item:(items.find(i=>i.active)?.name)||"",status:"예약"};
  const timeOpts=(lid,cur)=>{ const step=laneStep(kind,lanes.find(l=>l.id===+lid)); const times=[]; for(let m=cfg.from-60;m<=cfg.to;m+=step) times.push(m); if(cur!=null&&!times.includes(cur)){ times.push(cur); times.sort((x,y)=>x-y); } return times.map(m=>`<option value="${m}" ${m===cur?"selected":""}>${hhmm(m)}</option>`).join(""); };
  const ro=canEdit?"":"disabled";
  dlg.innerHTML=`<form method="dialog" id="apf"><h3 style="margin:0 0 12px">${a?"예약 보기·수정":"예약 추가"} <span class="meta" style="font-weight:400">${kind==="pt"?"도수·충격파":"근전도"}</span></h3>
    <div class="form-2">
      <div class="field"><label for="a_d">날짜</label><input id="a_d" type="date" value="${v.appt_date}" ${ro}></div>
      <div class="field"><label for="a_t">시작</label><select id="a_t" ${ro}>${timeOpts(v.lane_id,v.start_min)}</select></div>
      <div class="field"><label for="a_l">방</label><select id="a_l" ${ro}>${lanes.map(l=>`<option value="${l.id}" ${l.id===v.lane_id?"selected":""}>${esc(l.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="a_i">치료</label><select id="a_i" ${ro}>${items.filter(i=>i.active||i.name===v.item).map(i=>`<option ${i.name===v.item?"selected":""}>${esc(i.name)}</option>`).join("")}${v.item&&!itemBy[v.item]?`<option selected>${esc(v.item)}</option>`:""}</select></div>
      <div class="field"><label for="a_c">차트번호</label><input id="a_c" value="${esc(v.chart_no||"")}" inputmode="numeric" ${ro}></div>
      <div class="field"><label for="a_n">환자 이름</label><input id="a_n" value="${esc(v.patient_name||"")}" autocomplete="off" ${ro}></div>
      <div class="field"><label for="a_s">담당자</label><input id="a_s" list="a_sl" value="${esc(v.staff||"")}" autocomplete="off" ${ro}><datalist id="a_sl">${staffNames.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>
      ${kind==="emg"?`<div class="field"><label for="a_dr">담당 원장</label><select id="a_dr" ${ro}><option value="">-</option>${docNames.map(n=>`<option ${n===v.doctor?"selected":""}>${esc(n)}</option>`).join("")}</select></div>`:`<div class="field"><label for="a_m">소요(분)</label><input id="a_m" value="${v.minutes}" inputmode="numeric" ${ro}></div>`}
      ${kind==="emg"?`<div class="field"><label for="a_nd">니들링 원장</label><select id="a_nd" ${ro}><option value="">-</option>${docNames.map(n=>`<option ${n===v.needle_doctor?"selected":""}>${esc(n)}</option>`).join("")}</select></div><div class="field"><label for="a_m">소요(분)</label><input id="a_m" value="${v.minutes}" inputmode="numeric" ${ro}></div>`:""}
      <div class="field"><label for="a_st">상태</label><select id="a_st" ${ro}>${["예약","완료","취소","노쇼"].map(s=>`<option ${s===v.status?"selected":""}>${s}</option>`).join("")}</select></div>
    </div>
    <div style="display:flex;gap:16px;margin:2px 0 12px;font-size:13px"><label><input type="checkbox" id="a_new" ${v.is_new?"checked":""} ${ro}> 신환</label><label><input type="checkbox" id="a_in" ${v.inpatient?"checked":""} ${ro}> 입원 환자</label></div>
    <div class="field"><label for="a_note">메모</label><input id="a_note" value="${esc(v.note||"")}" placeholder="부위, 특이사항 (전화번호는 적지 마세요)" ${ro}></div>
    <div id="a_hist" class="ahist"></div>
    <p class="err" id="a_err"></p>
    <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
      <div>${a&&canEdit?`<button class="btn ghost" id="a_del" type="button" style="color:var(--bad);border-color:var(--bad)">삭제</button>`:""}</div>
      <div style="display:flex;gap:8px"><button class="btn ghost" value="cancel" formnovalidate>닫기</button>${canEdit?`<button class="btn" id="a_ok" type="button">저장</button>`:""}</div></div></form>`;
  dlg.showModal();

const SH_COLORS={blue:"var(--c-blue)",navy:"var(--c-navy)",teal:"var(--c-teal)",purple:"var(--c-purple)",gray:"var(--c-gray)",orange:"var(--c-orange)",red:"var(--c-red)"};
const STAFF_DEPTS=["의료진","간호","수술","병동","원무","물리치료","영상의학","임상병리","경영지원"];
function canEditDept(dept){ const me=S.me; return me.level<=2 || me.perms?.sched_staff==="edit" || (me.level===3 && me.dept===dept); }
function shiftHours(v,codes){ const c=codes[v]; if(c&&c.start_min!=null&&c.end_min!=null) return (c.end_min-c.start_min)/60;
  const t=String(v).match(/(\d{1,2})(?::(\d{2}))?\s*-\s*(\d{1,2})(?::(\d{2}))?/); if(!t) return 0; const a=+t[1]*60+(+t[2]||0), b=+t[3]*60+(+t[4]||0); return b>a?(b-a)/60:0; }
function shiftColor(v,codes){ const c=codes[v]; if(c) return SH_COLORS[c.color]||SH_COLORS.blue; if(/off|휴/i.test(v)) return SH_COLORS.gray; if(/연차|반차|학회|교육/.test(v)) return SH_COLORS.orange;
  const t=String(v).match(/(\d{1,2})(?::\d{2})?\s*-\s*(\d{1,2})/); if(t){ const a=+t[1], b=+t[2]; if(a>=17) return SH_COLORS.purple; if(a>=12) return SH_COLORS.teal; if(b>=21) return SH_COLORS.navy; return SH_COLORS.blue; } return SH_COLORS.blue; }
const DEPT_COLORS={"의료진":"#1858a8","간호":"#d0457a","병동":"#7656b8","수술":"#1c8c8c","원무":"#d17a12","물리치료":"#2f8f4e","영상의학":"#5b6fd6","임상병리":"#a35b2a","경영지원":"#6b7785"};
const deptColor=d=>DEPT_COLORS[d]||"#4a7fb5";
const isOffVal=(v,codes)=>{ const c=codes[v]; return c?c.is_off:/^(off|휴무?|연차|병가|학회)$/i.test(String(v).trim()); };

const DOC_DEPTS=["공통","회의록","원무","간호","병동","수술","물리치료","영상의학","임상병리","청구","경영지원"];
function canEditDoc(dept){ const me=S.me; return me.level<=2 || me.dept===dept || (["공통","회의록","청구"].includes(dept) && me.level<=3); }
function mdRender(src){
  const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,"$1<i>$2</i>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
  const lines=String(src||"").split(/\r?\n/); let out="", list=null, tbl=null;
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } if(tbl){ out+=`<div class="tbl-box"><table>${tbl.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</table></div>`; tbl=null; } };
  for(const raw of lines){ const l=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(l)){ if(list){ out+=`</${list}>`; list=null; } const cells=l.trim().slice(1,-1).split("|").map(c=>c.trim()); if(cells.every(c=>/^:?-{2,}:?$/.test(c))) continue; (tbl ||= []).push(cells); continue; }
    if(tbl){ const t=tbl; tbl=null; out+=`<div class="tbl-box"><table>${t.map((r,i)=>`<tr>${r.map(c=>i===0?`<th>${inl(c)}</th>`:`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</table></div>`; }
    let m;
    if(/^-{3,}$/.test(l.trim())){ close(); out+="<hr>"; continue; }
    if((m=l.match(/^(#{1,3})\s+(.*)$/))){ close(); out+=`<h${m[1].length+2}>${inl(m[2])}</h${m[1].length+2}>`; continue; }
    if((m=l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))){ if(list!=="ul"){ close(); out+='<ul class="chk">'; list="ul"; } out+=`<li><input type="checkbox" disabled ${m[1].trim()?"checked":""}> ${inl(m[2])}</li>`; continue; }
    if((m=l.match(/^\s*[-*•]\s+(.*)$/))){ if(list!=="ul"){ close(); out+="<ul>"; list="ul"; } out+=`<li>${inl(m[1])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)$/))){ if(list!=="ol"){ close(); out+="<ol>"; list="ol"; } out+=`<li>${inl(m[1])}</li>`; continue; }
    close(); out+= l.trim() ? `<p>${inl(l)}</p>` : "";
  }
  close(); return out || `<p class="meta">내용이 없습니다.</p>`;
}

  if($("radd")) $("radd").onclick=async()=>{ const data={}; if(cur.date_col) data[cur.date_col]=kstToday(); const {data:row,error}=await sb.from("register_rows").insert({register_id:cur.id,branch_id:S.branch,data,row_date:dateOf(data),sort:-1}).select("id").single(); if(error) return toast(errMsg(error)); st.q=""; await renderRegisters(opts); const td=document.querySelector(`tr[data-r="${row.id}"] td[data-k]`); if(td) td.click(); };
  if(ed){ const byId=Object.fromEntries(rows.map(r=>[r.id,r]));
    document.querySelectorAll("table.reg td[data-k]").forEach(td=>{ const open=()=>{ if(td.querySelector("textarea")) return; const tr=td.parentElement, rid=+tr.dataset.r, k=td.dataset.k, row=byId[rid]; const old=row.data?.[k]??"";

        let done=false; const fin=async save=>{ if(done) return; done=true; const v=ta.value; td.textContent=save?v:old; if(!save||v===old) return; const data={...(row.data||{}),[k]:v}; if(!v) delete data[k];
          const {error}=await sb.from("register_rows").update({data,row_date:dateOf(data)}).eq("id",rid); if(error){ toast(errMsg(error)); td.textContent=old; return; } row.data=data; };
        ta.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); fin(true).then(()=>{ const nx=tr.nextElementSibling?.querySelector(`td[data-k="${k}"]`); if(nx) nx.click(); }); } else if(e.key==="Escape"){ fin(false); } else if(e.key==="Tab"){ e.preventDefault(); fin(true).then(()=>{ const n=e.shiftKey?td.previousElementSibling:td.nextElementSibling; if(n&&n.dataset.k) n.click(); }); } };
        ta.onblur=()=>fin(true); };
      td.addEventListener("click",open); td.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target===td){ e.preventDefault(); open(); } }); });

      <button type="button" class="btn ghost sm" id="cadd">+ 열 추가</button>
      <p class="meta">열 이름을 비우고 저장하면 그 열은 화면에서 빠집니다(자료는 남음). 날짜열을 고르면 월별로 볼 수 있습니다.</p>
      <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" value="cancel">닫기</button><button type="button" class="btn" id="csave">저장</button></div></form>`;
    dlg.showModal(); let nc=cols.length; let order=cols.map((c,i)=>i); const keys=cols.map(c=>c.key);
    $("cadd").onclick=()=>{ let k; do{ k="c"+(nc++); }while(keys.includes(k)); keys.push(k); const i=keys.length-1; order.push(i); $("clist").insertAdjacentHTML("beforeend",`<div class="inline-form" style="margin-bottom:6px" data-ci="${i}"><input data-cl="${i}" value="" placeholder="새 열 이름" style="height:30px;flex:1;padding:0 8px"><label class="meta" style="display:flex;gap:4px;align-items:center"><input type="radio" name="cdate" value="${k}">날짜열</label></div>`); };
    dlg.querySelectorAll("[data-cup]").forEach(b=>b.onclick=()=>{ const el=b.closest("[data-ci]"); const prev=el.previousElementSibling; if(prev) el.parentNode.insertBefore(el,prev); });

      const dc=dlg.querySelector('input[name="cdate"]:checked')?.value||null;
      const {error}=await sb.from("registers").update({name:$("cn").value.trim()||cur.name,columns,date_col:dc}).eq("id",cur.id); if(error) return toast(errMsg(error)); dlg.close(); renderRegisters(opts); };
  };
}

}

async function resvUpload(file,st){ if(!file) return;
  try{ const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{cellDates:true}); const aoa=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});
    const hi=aoa.findIndex(r=>r.some(x=>/환자명|성명|수진자/.test(String(x)))); if(hi<0) return toast("환자명 열을 찾지 못했습니다");
    const H=aoa[hi].map(x=>String(x).trim()); const ci=re=>H.findIndex(h=>re.test(h));
    const cC=ci(/환자번호|차트|등록번호/), cN=ci(/환자명|성명|수진자/), cP=ci(/예약기간|예약일시|예약일자|예약일|일시|날짜/), cT=ci(/^시간$|예약시간/), cM=ci(/예약메모|메모|내용/), cS=ci(/과목|진료과/), cD=ci(/주치의|의사|담당/);
    if(cP<0) return toast("예약기간(날짜) 열을 찾지 못했습니다");
    const rows=[]; const bad=[];
    aoa.slice(hi+1).forEach((r,i)=>{ if(!r.some(x=>String(x).trim())) return; let v=r[cP]; let date=null, time="";
      if(v instanceof Date){ date=ymd(new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()))); time=v.getHours()||v.getMinutes()?`${String(v.getHours()).padStart(2,"0")}:${String(v.getMinutes()).padStart(2,"0")}`:""; }
      else if(typeof v==="number"&&v>30000){ const d=new Date(Date.UTC(1899,11,30)+v*864e5); date=ymd(d); const fr=Math.round((v%1)*1440); if(fr) time=`${String(Math.floor(fr/60)).padStart(2,"0")}:${String(fr%60).padStart(2,"0")}`; }
      else { const s=String(v); date=parseDateCell(s,st.date.slice(0,4)); const tm=s.match(/(\d{1,2}):(\d{2})/); if(tm) time=`${tm[1].padStart(2,"0")}:${tm[2]}`; }
      if(cT>=0&&!time){ const t=r[cT]; const m=typeof t==="number"&&t<1?Math.round(t*1440):parseTimeCell(t); if(m!=null) time=`${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`; }
      if(!date){ bad.push(i+hi+2); return; }
      rows.push({branch_id:S.branch,resv_date:date,resv_time:time||null,chart_no:cC>=0?String(r[cC]).trim()||null:null,patient_name:String(r[cN]).trim()||null,memo:cM>=0?String(r[cM]).trim()||null:null,subject:cS>=0?String(r[cS]).trim()||null:null,doctor:cD>=0?String(r[cD]).trim()||null:null,source:"emr"}); });
    if(!rows.length) return toast("읽은 예약이 없습니다");
    const dates=[...new Set(rows.map(r=>r.resv_date))]; const {data:ex}=await sb.from("reservations").select("resv_date,resv_time,chart_no,patient_name").eq("branch_id",S.branch).in("resv_date",dates);
    const key=r=>[r.resv_date,r.resv_time||"",r.chart_no||r.patient_name||""].join("|"); const have=new Set((ex||[]).map(key)); const fresh=rows.filter(r=>!have.has(key(r)));
    const dlg=$("dlg"); dlg.innerHTML=`<form method="dialog"><h3 style="margin:0 0 12px">EMR 예약 올리기</h3><p>${rows.length}건을 읽었습니다. 이미 있는 ${rows.length-fresh.length}건은 건너뛰고 <b>${fresh.length}건</b>을 추가합니다.</p>
      <p class="meta">날짜: ${dates.sort().map(d=>`${+d.slice(5,7)}/${+d.slice(8)}`).join(", ")}${bad.length?` · 날짜를 못 읽은 행: ${bad.slice(0,10).join(", ")}`:""}</p>
      <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" value="cancel">취소</button><button type="button" class="btn" id="vu_ok" ${fresh.length?"":"disabled"}>추가</button></div></form>`;
    dlg.showModal(); $("vu_ok").onclick=async()=>{ for(let i=0;i<fresh.length;i+=500){ const {error}=await sb.from("reservations").insert(fresh.slice(i,i+500)); if(error) return toast(errMsg(error)); } dlg.close(); toast(`${fresh.length}건 추가`); st.date=dates.includes(st.date)?st.date:dates.sort()[0]; renderResv(); };
  }catch(e){ toast(e.message||String(e)); } }

const telLink=p=>{ const s=String(p||"").trim(); if(!s) return ""; return s.split(/\s*[\n,/]\s*/).filter(Boolean).map(x=>/\d{2,}/.test(x)?`<a href="tel:${esc(x.replace(/[^\d+]/g,""))}">${esc(x)}</a>`:esc(x)).join("<br>"); };
function infoTabs(cur){ return `<div class="seg infotabs" role="tablist" aria-label="기본정보 메뉴" style="margin-bottom:12px">${INFO_TABS.map(([k,l])=>`<button role="tab" data-it="${k}" aria-pressed="${cur===k}">${l}</button>`).join("")}</div>`; }
function bindInfoTabs(){ document.querySelectorAll("[data-it]").forEach(b=>b.onclick=()=>{ S.infoTab=b.dataset.it; renderInfo(); }); }
async function renderInfo(){
  const tab=S.infoTab ||= "info";
  if(tab==="info"||tab==="etc"){
    const lr=await sb.from("registers").select("id,name").eq("branch_id",S.branch).eq("dept","공통").eq("active",true).order("sort");
    const regs=lr.data||[]; const info=regs.find(r=>r.name.startsWith("기본정보")); const vend=regs.find(r=>r.name==="업체연락망");
    const filter = tab==="info" ? (r=>info&&r.id===info.id) : (r=>(!info||r.id!==info.id)&&(!vend||r.id!==vend.id));
    if(tab==="info"&&info){ (S.regInfo ||= {dept:"공통"}).id=info.id; }
    else if(tab==="etc"){ const st=S.regInfo ||= {dept:"공통"}; if(info&&st.id===info.id) st.id=null; if(vend&&st.id===vend.id) st.id=null; }
    return renderRegisters({dept:"공통", filter, top:infoTabs(tab), bind:bindInfoTabs, title:tab==="info"?"기본정보":"기타 자료", hideList:tab==="info"});
  }
  if(tab==="vendor") return renderVendors();
  if(tab==="staff") return renderStaffDir();
  if(tab==="org") return renderOrg();
}

async function loadOrgData(){
  const [sr,or]=await Promise.all([ sb.from("staff").select("id,name,dept,sort,active,title,phone,lead,memo").eq("branch_id",S.branch).eq("active",true).order("sort"),
    sb.from("org_people").select("*").eq("branch_id",S.branch).order("tier").order("sort") ]);
  const staff=(sr.data||[]).filter(s=>s.dept!=="의료진"&&!PLACEHOLDER.test(s.name));
  const depts=[...STAFF_DEPTS.filter(d=>d!=="의료진"&&staff.some(s=>s.dept===d)), ...[...new Set(staff.map(s=>s.dept))].filter(d=>!STAFF_DEPTS.includes(d))];
  return {staff, org:or.data||[], depts};
}

const FIN_CATS={"수입":["공단 청구 입금","기타 수입"],"지출":["인건비","임대료·관리비","재료·약품비","광고·마케팅","장비·리스","외주·용역","세금·보험","이자·금융","기타"]};
const FIN_COLORS=["#1858a8","#2a9fd0","#6aa84f","#e69138","#8e7cc3","#c27ba0","#45818e","#cc4125","#a0a0a0"];
function dcMoney(rows){ const s=k=>rows.reduce((a,r)=>a+(+r[k]||0),0);
  return {total:rows.filter(r=>+r.total>0).reduce((a,r)=>a+(+r.total||0),0), card:s("pay_card"), cash:s("pay_cash"), acct:s("pay_account"), pay:s("pay_card")+s("pay_cash")+s("pay_account"),
    inc:s("inc_cash")+s("inc_card")+s("inc_account"), exp:s("exp_cash")+s("exp_card")+s("exp_free"), days:rows.filter(r=>+r.total>0).length}; }
function finCalc(dc,E){ const sum=(k,f)=>E.filter(e=>e.kind===k&&(!f||f(e))).reduce((a,e)=>a+(+e.amount||0),0);
  const claim=sum("수입",e=>e.category==="공단 청구 입금"), other=sum("수입",e=>e.category!=="공단 청구 입금"), expIn=sum("지출");
  const expAll=expIn+dc.exp; const cashIn=dc.pay+dc.inc+claim+other;
  return {claim,other,expIn,expAll,cashIn,cashPL:cashIn-expAll,accrual:dc.total+dc.inc+other,accPL:dc.total+dc.inc+other-expAll}; }

async function apptConflicts(row, selfId, lanes){
  const {data}=await sb.from("appointments").select("id,start_min,minutes,lane_id,chart_no,patient_name,item,status").eq("branch_id",row.branch_id).eq("kind",row.kind).eq("appt_date",row.appt_date);
  const out=[]; const s=row.start_min, e=s+row.minutes; const ln=id=>(lanes||[]).find(l=>l.id===id)?.name||"";
  (data||[]).filter(a=>a.id!==selfId&&a.status!=="취소"&&a.status!=="노쇼").forEach(a=>{ const as=a.start_min, ae=as+(+a.minutes||0); const who=[a.chart_no,a.patient_name].filter(Boolean).join(" ")||"(이름 없음)"; const ov=as<e&&s<ae;
    if(a.lane_id===row.lane_id&&ov) out.push(`같은 방(${ln(a.lane_id)}) ${hhmm(as)}~${hhmm(ae)}에 ${who} · ${a.item} 예약이 있습니다`);
    else if(row.chart_no&&a.chart_no===row.chart_no&&ov) out.push(`같은 환자가 같은 시간(${hhmm(as)}) ${ln(a.lane_id)}에 이미 예약되어 있습니다`);
    else if(row.chart_no&&a.chart_no===row.chart_no&&a.item===row.item) out.push(`같은 환자가 이날 ${hhmm(as)}에 같은 치료(${a.item})를 이미 예약했습니다`); });
  return out;
}
